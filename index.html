function generateCircuit(level) {
  const safeLevel = Math.max(1, Math.min(30, level || 1));
  const seed = safeLevel * 1013904223 + 1664525 >>> 0;
  const rng = createRng(seed);
  const mapCfg = LEVEL_MAPS[safeLevel - 1];
  const name = mapCfg.name;
  const biome = mapCfg;
  const archetype = {
    id: `level_${safeLevel}`,
    name: mapCfg.layoutName,
    difficultyLabel: mapCfg.difficultyLabel,
    diffStars: mapCfg.diffStars,
    laps: mapCfg.laps
  };
  const nodeCount = 32;
  // Track size grows with level while trackWidth gets progressively narrower from 236px (Lv 1) down to 162px (Lv 30)
  const levelRatio = (safeLevel - 1) / 29;
  const baseRadiusX = (1250 + safeLevel * 32) * mapCfg.aspectX;
  const baseRadiusY = (1100 + safeLevel * 28) * mapCfg.aspectY;
  const trackWidth = Math.round(264 - levelRatio * 68);
  const curbWidth = 26;
  const rotation = (safeLevel - 1) * 0.47;
  const cosR = Math.cos(rotation);
  const sinR = Math.sin(rotation);
  const rawRadii = [];
  const angleStep = Math.PI * 2 / nodeCount;
  const jitterAmp = 0.02 + levelRatio * 0.04;
  for (let i = 0; i < nodeCount; i++) {
    const a = i * angleStep;
    const baseR = mapCfg.shapeFn(a);
    const r = clamp(baseR + (rng() - 0.5) * jitterAmp, 0.48, 1.48);
    rawRadii.push(r);
  }
  // Double-pass smooth radii so high-speed corners & chicanes flow like real FIA Grade-1 circuits
  const pass1Radii = rawRadii.map((r, i) => {
    const prev = rawRadii[(i - 1 + nodeCount) % nodeCount];
    const next = rawRadii[(i + 1) % nodeCount];
    return prev * 0.24 + r * 0.52 + next * 0.24;
  });
  const smoothedRadii = pass1Radii.map((r, i) => {
    const prev = pass1Radii[(i - 1 + nodeCount) % nodeCount];
    const next = pass1Radii[(i + 1) % nodeCount];
    return prev * 0.18 + r * 0.64 + next * 0.18;
  });
  const waypoints = [];
  for (let i = 0; i < nodeCount; i++) {
    const angle = i * angleStep;
    const rFactor = smoothedRadii[i];
    const lx = Math.cos(angle) * baseRadiusX * rFactor;
    const ly = Math.sin(angle) * baseRadiusY * rFactor;
    waypoints.push({
      x: lx * cosR - ly * sinR,
      y: lx * sinR + ly * cosR
    });
  }
  let sumX = 0;
  let sumY = 0;
  for (const wp of waypoints) {
    sumX += wp.x;
    sumY += wp.y;
  }
  const avgX = sumX / nodeCount;
  const avgY = sumY / nodeCount;
  for (const wp of waypoints) {
    wp.x -= avgX;
    wp.y -= avgY;
  }
  const rawPoints = [];
  const stepsPerSegment = 30;
  for (let i = 0; i < nodeCount; i++) {
    const p0 = waypoints[(i - 1 + nodeCount) % nodeCount];
    const p1 = waypoints[i];
    const p2 = waypoints[(i + 1) % nodeCount];
    const p3 = waypoints[(i + 2) % nodeCount];
    for (let s = 0; s < stepsPerSegment; s++) {
      const t = s / stepsPerSegment;
      rawPoints.push(catmullRom(p0, p1, p2, p3, t));
    }
  }
  const samples = [];
  let cumDist = 0;
  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;
  for (let i = 0; i < rawPoints.length; i++) {
    const curr = rawPoints[i];
    const next = rawPoints[(i + 1) % rawPoints.length];
    const prev = rawPoints[(i - 1 + rawPoints.length) % rawPoints.length];
    const dx = next.x - prev.x;
    const dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    const tx = dx / len;
    const ty = dy / len;
    const nx = -ty;
    const ny = tx;
    const segDx1 = curr.x - prev.x;
    const segDy1 = curr.y - prev.y;
    const segDx2 = next.x - curr.x;
    const segDy2 = next.y - curr.y;
    const a1 = Math.atan2(segDy1, segDx1);
    const a2 = Math.atan2(segDy2, segDx2);
    const curvature = Math.abs(normalizeAngle(a2 - a1));
    samples.push({
      x: curr.x,
      y: curr.y,
      tx,
      ty,
      nx,
      ny,
      dist: cumDist,
      curvature
    });
    const stepDist = Math.hypot(next.x - curr.x, next.y - curr.y);
    cumDist += stepDist;
    minX = Math.min(minX, curr.x);
    maxX = Math.max(maxX, curr.x);
    minY = Math.min(minY, curr.y);
    maxY = Math.max(maxY, curr.y);
  }
  const worldMargin = 500;
  const worldMinX = minX - worldMargin;
  const worldMaxX = maxX + worldMargin;
  const worldMinY = minY - worldMargin;
  const worldMaxY = maxY + worldMargin;
  const startingGrid = [];
  const numSamplesGrid = samples.length;
  for (let gIdx = 0; gIdx < 4; gIdx++) {
    const sampleBackSteps = gIdx * 3;
    const sIdx = (numSamplesGrid - sampleBackSteps) % numSamplesGrid;
    const gpt = samples[sIdx];
    const latSign = (gIdx % 2 === 0) ? -1 : 1;
    const latOff = latSign * trackWidth * 0.22;
    startingGrid.push({
      x: gpt.x + gpt.nx * latOff,
      y: gpt.y + gpt.ny * latOff,
      angle: Math.atan2(gpt.ty, gpt.tx),
      splineIdx: sIdx,
      latOffset: latOff
    });
  }
  const decorations = [];
  const halfRoad = trackWidth * 0.5;
  const bannerTexts = [name.toUpperCase().slice(0, 14), mapCfg.biomeName.toUpperCase(), `ZORLUK: ${mapCfg.difficultyLabel}`, `HARİTA ${safeLevel} / 30`];
  for (let idx = 10; idx <= 70; idx += 20) {
    if (idx < samples.length) {
      const pt = samples[idx];
      decorations.push({
        type: 'banner',
        x: pt.x + pt.nx * (halfRoad + curbWidth + 30),
        y: pt.y + pt.ny * (halfRoad + curbWidth + 30),
        angle: Math.atan2(pt.ty, pt.tx),
        text: bannerTexts[(idx / 20 | 0) % bannerTexts.length],
        width: 80,
        height: 20
      });
    }
  }
  let lastTireIdx = -50;
  for (let i = 0; i < samples.length; i += 6) {
    const pt = samples[i];
    if (pt.curvature > 0.032) {
      if (Math.abs(i - lastTireIdx) >= 4) {
        decorations.push({

          // 4. Sculpted 3D Alpine Mountain Ranges around the Horizon
          const mtnGroup = new THREE.Group();

          // 5. Ultra-High-Resolution 1024x1024 Broadcast-Grade FIA Grade-1 Asphalt Texture (Micro-Aggregate + Skid Marbles + Rubbered Racing Line + Wet Reflection Sheen)
          const aspCan = document.createElement('canvas');
          aspCan.width = 1024;
          aspCan.height = 1024;
          const aCtx = aspCan.getContext('2d');
          aCtx.fillStyle = '#1b1f27';
          aCtx.fillRect(0, 0, 1024, 1024);
          // Micro stone aggregate & tarmac bitumen variation
          for (let i = 0; i < 42000; i++) {

            const v = (i % 5 === 0) ? 44 : (i % 5 === 1 ? 14 : (i % 5 === 2 ? 25 : (i % 5 === 3 ? 34 : 52)));
            aCtx.fillStyle = `rgb(${v},${v + 2},${v + 6})`;
            aCtx.globalAlpha = 0.38;
            aCtx.fillRect(ax, ay, (i % 3 === 0) ? 3 : 2, (i % 4 === 0) ? 3 : 2);
          }
          // Longitudinal paving machine micro-striations
          aCtx.globalAlpha = 0.08;
          for (let sx = 0; sx < 1024; sx += 8) {
            aCtx.fillStyle = (sx % 16 === 0) ? '#090d14' : '#334155';
            aCtx.fillRect(sx, 0, 3, 1024);
          }
          // Heavy darkened rubbered-in F1 racing grooves + tire skid streaks
          const rGradL = aCtx.createLinearGradient(90, 0, 420, 0);
          rGradL.addColorStop(0, 'rgba(4,6,11,0)');
          rGradL.addColorStop(0.45, 'rgba(4,6,11,0.62)');
          rGradL.addColorStop(0.55, 'rgba(4,6,11,0.66)');
          rGradL.addColorStop(1, 'rgba(4,6,11,0)');
          aCtx.fillStyle = rGradL;
          aCtx.globalAlpha = 1.0;
          aCtx.fillRect(90, 0, 330, 1024);

          const rGradR = aCtx.createLinearGradient(604, 0, 934, 0);
          rGradR.addColorStop(0, 'rgba(4,6,11,0)');
          rGradR.addColorStop(0.45, 'rgba(4,6,11,0.62)');
          rGradR.addColorStop(0.55, 'rgba(4,6,11,0.66)');
          rGradR.addColorStop(1, 'rgba(4,6,11,0)');
          aCtx.fillStyle = rGradR;
          aCtx.fillRect(604, 0, 330, 1024);

          // Rubber marbles outside the racing groove
          aCtx.fillStyle = '#070a0f';
          aCtx.globalAlpha = 0.55;
          for (let m = 0; m < 1600; m++) {
            const mx = (m % 2 === 0) ? (12 + ((m * 73) % 85)) : (925 + ((m * 73) % 85));
            const my = (m * 151) & 1023;
            aCtx.fillRect(mx, my, 3, 4);
          }

          // Subtle asphalt paver seam & centerline dashes
          aCtx.globalAlpha = 1.0;
          aCtx.fillStyle = 'rgba(0,0,0,0.35)';
          aCtx.fillRect(510, 0, 4, 1024);
          aCtx.fillStyle = 'rgba(255,255,255,0.06)';
          aCtx.fillRect(508, 0, 8, 1024);
          const aspTex = markSRGB(new THREE.CanvasTexture(aspCan));
          aspTex.wrapS = THREE.RepeatWrapping;
          aspTex.wrapT = THREE.RepeatWrapping;
          aspTex.anisotropy = 4;

          // Helper to build UV-mapped 3D Track Ribbons with Z-fighting protection
          const addRibbonMesh = (offsetA, offsetB, yHeight, colorHexA, colorHexB, stripePeriod, opts = {}) => {
            const positions = [];
            const colors = [];
            const uvs = [];
            const cA = srgbCol(colorHexA);
            const cB = srgbCol(colorHexB || colorHexA);
            const extrudeY = opts.extrudeY || 0;
            for (let i = 0; i < totalSamples; i++) {
              const p1 = samples[i];
              const p2 = samples[(i + 1) % totalSamples];
              const useA = stripePeriod ? (Math.floor(i / stripePeriod) % 2 === 0) : true;
              const col = useA ? cA : cB;

              const x1a = p1.x + p1.nx * offsetA, z1a = p1.y + p1.ny * offsetA;
              const x1b = p1.x + p1.nx * offsetB, z1b = p1.y + p1.ny * offsetB;
              const x2a = p2.x + p2.nx * offsetA, z2a = p2.y + p2.ny * offsetA;
              const x2b = p2.x + p2.nx * offsetB, z2b = p2.y + p2.ny * offsetB;

              const v1 = i * 0.25;
              const v2 = (i + 1) * 0.25;

              positions.push(
                x1a, yHeight, z1a,
                x1b, yHeight, z1b,
                x2b, yHeight, z2b,
                x1a, yHeight, z1a,
                x2b, yHeight, z2b,
                x2a, yHeight, z2a
              );
              uvs.push(0, v1, 1, v1, 1, v2, 0, v1, 1, v2, 0, v2);
              for (let k = 0; k < 6; k++) colors.push(col.r, col.g, col.b);

              if (extrudeY > 0) {
                const sideCol = col.clone().multiplyScalar(0.78);
                positions.push(
                  x1a, -1.5, z1a,
                  x1a, yHeight, z1a,
                  x2a, yHeight, z2a,
                  x1a, -1.5, z1a,
                  x2a, yHeight, z2a,
                  x2a, -1.5, z2a,
                  x1b, yHeight, z1b,
                  x1b, -1.5, z1b,
                  x2b, -1.5, z2b,
                  x1b, yHeight, z1b,
                  x2b, -1.5, z2b,
                  x2b, yHeight, z2b
                );
                for (let k = 0; k < 12; k++) {
                  uvs.push(0, 0);
                  colors.push(sideCol.r, sideCol.g, sideCol.b);
                }
              }
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));

            const mat = opts.pbr ? new THREE.MeshStandardMaterial({

              bumpScale: opts.bumpScale || 0.28,

              metalness: opts.metalness ?? 0.12,

              polygonOffsetUnits: opts.polyOffset || 0

            const mesh = new THREE.Mesh(geo, mat);

          addRibbonMesh(halfRoad + curbW + 6.5, halfRoad + curbW + 14.5, 0.45, '#0f2942', '#173753', 4, { polyOffset: -2 });

          addRibbonMesh(halfRoad + curbW, halfRoad + curbW + 6.5, 0.55, '#154726', '#10381e', 0, { polyOffset: -2 });

          addRibbonMesh(-(halfRoad + curbW), -halfRoad, 1.95, biome.curbA, biome.curbB, 2, {

          addRibbonMesh(halfRoad, halfRoad + curbW, 1.95, biome.curbA, biome.curbB, 2, {
            pbr: true,
            extrudeY: 1.95,
            roughness: 0.42,
            metalness: 0.12,

          });

          // Main PBR Asphalt Tarmac Road with Micro-Aggregate Bump & Wet/Dry Specular Sheen
          addRibbonMesh(-halfRoad, halfRoad, 0.65, '#ffffff', '#ffffff', 0, {

          // Crisp White Painted FIA Track Limit Lines (Double Edge + Subtle Specular)
          addRibbonMesh(-halfRoad, -(halfRoad - 3.8), 1.18, '#f8fafc', '#f8fafc', 0, { polyOffset: -3 });
          addRibbonMesh(halfRoad - 3.8, halfRoad, 1.18, '#f8fafc', '#f8fafc', 0, { polyOffset: -3 });

          // Continuous 3D Triple-Wave Steel Armco Guardrails + Tecpro-Style Barrier Sections outside the runoff
          const guardDist = halfRoad + curbW + gravelWidth + 14;
          addRibbonMesh(-(guardDist + 2.8), -guardDist, 10.4, '#94a3b8', '#e2e8f0', 2, {
            pbr: true,
            extrudeY: 10.4,
            roughness: 0.28,

          });
          addRibbonMesh(guardDist, guardDist + 2.8, 10.4, '#94a3b8', '#e2e8f0', 2, {
            pbr: true,
            extrudeY: 10.4,
            roughness: 0.28,

          });

          // Trackside F1 Sponsor Advertising Hoardings & FIA Catch-Fence Stanchion Posts along the Guardrails
          const postGeo = new THREE.BoxGeometry(1.8, 24, 1.8);
          const postMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.72, roughness: 0.32 });
          const sponsorNames = [
            { bg: '#e10600', fg: '#ffffff', txt: 'ORACLE  •  FORMULA 1' },
            { bg: '#facc15', fg: '#090d16', txt: 'PIRELLI  P ZERO' },
            { bg: '#00a19b', fg: '#ffffff', txt: 'PETRONAS  SYNTIUM' },
            { bg: '#06311f', fg: '#facc15', txt: 'ROLEX  •  OFFICIAL TIME' },
            { bg: '#0284c7', fg: '#ffffff', txt: 'ARAMCO  •  POWER' }
          ];
          const sponsorBoardMats = sponsorNames.map(sp => {

          });
          const boardGeo = new THREE.BoxGeometry(36, 9.2, 1.4);

          for (let i = 0; i < totalSamples; i += 8) {

          // Checkered Start / Finish Line + Painted Starting Grid Boxes (P1..P4)

          // Painted FIA Starting Grid Brackets under each starting slot (White & Yellow FIA Grid Box Markings)
          if (track.startingGrid) {

              bGrp.position.set(slot.x, 1.28, slot.y);

          // 6. Detailed 3D Start/Finish Gantry Arch + Modern F1 Pit Lane Garage Complex + Sponsor Bridges + Floodlight Towers
          const s0 = samples[0];

          const banTex = markSRGB(new THREE.CanvasTexture(banCan));

          );
          topBeam.position.set(0, 80, 0);
          topBeam.castShadow = true;
          gantryGroup.add(pLeft, pRight, topBeam);

          // 5 FIA Starting Light Pods under the Gantry
          st.gantryLights = [];
          for (let li = 0; li < 5; li++) {
            const podZ = (li - 2) * 18;
            const podBox = new THREE.Mesh(new THREE.BoxGeometry(6, 13, 10), trussMat);
            podBox.position.set(-6, 65, podZ);
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0x3f0a0a });

            bulb.position.set(-9.5, 65, podZ);
            gantryGroup.add(podBox, bulb);

          // Modern 3D F1 Pit Garage & VIP Paddock Club Building along the Start Straight (Right Side)
          const pitSample = samples[Math.min(18, totalSamples - 1)];

            const pitOut = halfRoad + curbW + gravelWidth + 82;
            pitGroup.position.set(pitSample.x + pitSample.nx * pitOut, 0, pitSample.y + pitSample.ny * pitOut);
            pitGroup.rotation.y = -Math.atan2(pitSample.ty, pitSample.tx);

            // Ground floor garage bays

              new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.3 })
            );
            garageBase.position.set(0, 13, 0);
            garageBase.castShadow = true;

            pitGroup.add(teamStripe);

            for (let bay = -3; bay <= 3; bay++) {

                new THREE.BoxGeometry(34, 18, 2),

              );

          // Grandstand Stadium Tribunes + Floodlight Towers around the Circuit
          const grandIndices = [

            Math.floor(totalSamples * 0.75)
          ];
          for (const gIdx of grandIndices) {

            const trib = new THREE.Group();
            const sideSign = gIdx === 8 ? -1 : 1;
            const distOut = halfRoad + curbW + gravelWidth + 96;

          // FIA 150m / 100m / 50m Braking Distance Marker Boards before major corners

          const mat150 = makeBrakeBoardMat('150');

          let lastCornerIdx = -40;

              });
              // Digital FIA LED Flag Panel at corner apex

                const panelOut = halfRoad + curbW + 18;

                const pPole = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.1, 14, 8), trussMat);
                pPole.position.y = 7;

          // Overhead FIA Sector Timing Bridges (SECTOR 1 / SECTOR 2 / SECTOR 3)
          const sectorBridgeDefs = [

            { frac: 0.66, title: 'SECTOR 2  •  PETRONAS MOTORSPORT', bg: '#0f172a', bar: '#00d2be' }

          sectorBridgeDefs.forEach(sb => {

          // 7. Realistic 3D Trackside Props (Layered Pine & Deciduous Trees, TecPro Tire Barriers, Apex Chevrons)

                  const leafMat = new THREE.MeshStandardMaterial({ color: cColor, roughness: 0.74, flatShading: true });
                  const cMain = new THREE.Mesh(foliageSphere, leafMat);

                  cSub2.position.set(11, 33, -7);
                  cSub2.scale.set(0.84, 0.88, 0.84);
                  treeGrp.add(cMain, cSub1, cSub2);

                scene.add(treeGrp);

          // 8. Build Hyper-Realistic Wind-Tunnel Sculpted 3D Formula 1 Cars (Oracle Red Bull Racing RB21 #1, Mercedes-AMG Petronas W16 #63, Scuderia Ferrari SF-25 #16, McLaren MCL39 #4)
          // High-Resolution 3K Diagonal Twill Carbon-Fiber Texture & Bump Map
          const cfCan = document.createElement('canvas');
          cfCan.width = 128;
          cfCan.height = 128;

              cfCtx.fillRect(x, y, 3, 3);

          carbonWeaveTex.wrapS = THREE.RepeatWrapping;

          // High-Resolution Pirelli P-Zero Tire Tread Texture (Circumferential Sheen + Micro Rubber Grain)
          const treadCan = document.createElement('canvas');

          trGrad.addColorStop(0.5, '#222938');

          trGrad.addColorStop(1, '#090c12');
          trCtx.fillStyle = trGrad;
          trCtx.fillRect(0, 0, 256, 128);

          const sharedTireRubberMat = new THREE.MeshStandardMaterial({

          shGradShared.addColorStop(0.64, 'rgba(0,0,0,0.62)');
          shGradShared.addColorStop(1, 'rgba(0,0,0,0)');
          shCtxShared.fillStyle = shGradShared;
          shCtxShared.fillRect(0, 0, 128, 64);
          const sharedShadowMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(shCanShared),
            transparent: true,

          // Helper to create wind-tunnel sculpted 3D ExtrudeGeometry centered along Z
          const makeCenteredExtrude = (pts, depth, bevelSize = 0.35, bevelThickness = 0.35, curveSegs = 16) => {
            const shape = new THREE.Shape();
            shape.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) {
              shape.lineTo(pts[i][0], pts[i][1]);
            }
            shape.closePath();
            const geo = new THREE.ExtrudeGeometry(shape, {
              depth,
              bevelEnabled: bevelSize > 0,
              bevelSegments: 4,
              steps: 1,
              bevelSize,
              bevelThickness,
              curveSegments: curveSegs
            });
            geo.translate(0, 0, -depth * 0.5);
            geo.computeVertexNormals();
            return geo;

          const createF1CarMesh = (carId) => {
            const grp = new THREE.Group();

            const paintMat = new THREE.MeshStandardMaterial({

            const suspensionMat = sharedSuspensionMat;

            const floorPts = [

              new THREE.BoxGeometry(44, 0.35, 5.8),
              new THREE.MeshStandardMaterial({ color: 0xb45309, metalness: 0.65, roughness: 0.32 })
            );
            skidPlank.position.set(-3.0, 0.82, 0);
            grp.add(skidPlank);

            for (const fSide of [-1, 1]) {
              // Metallic team-accent floor edge stripe
              const floorEdge = new THREE.Mesh(new THREE.BoxGeometry(39, 0.55, 1.35), accentMat);
              floorEdge.position.set(-2.5, 2.28, fSide * 14.3);
              grp.add(floorEdge);
              // Aerodynamic floor edge up-scroll wing + 4 vortex generator strakes
              const edgeScroll = new THREE.Mesh(new THREE.BoxGeometry(26, 1.1, 0.7), carbonMat);
              edgeScroll.position.set(-4.5, 2.65, fSide * 14.65);
              edgeScroll.rotation.x = fSide * 0.28;
              grp.add(edgeScroll);

                fin.position.set(8.5 - fg * 4.2, 2.75, fSide * 14.45);
                fin.rotation.y = fSide * 0.34;
                grp.add(fin);

              const bargeBoard = new THREE.Mesh(new THREE.BoxGeometry(6.8, 4.4, 0.45), carbonMat);
              bargeBoard.position.set(13.8, 3.6, fSide * 8.4);
              bargeBoard.rotation.y = fSide * 0.26;
              grp.add(bargeBoard);

            brakeLight.position.set(-33.35, 4.45, 0);

            // Individual bright LED lenses on the rear rain light
            for (let ledIdx = -2; ledIdx <= 2; ledIdx++) {

            // 4. Sculpted Wind-Tunnel Carbon Monocoque Survival Cell & Contoured Droop Nose Cone
            const monoPts = [

            // Nose Tip Accent Cap (Red Bull Yellow Sun Tip / Ferrari White / Mercedes Petronas Teal / McLaren Anthracite)
            const noseTipMat = isRedBull

            const noseTipPts = [

              opacity: 0.0,
              depthWrite: false
            });
            const vortexGeo = new THREE.CylinderGeometry(0.12, 0.65, 28, 8);
            vortexGeo.rotateZ(Math.PI / 2);
            const vortexLeft = new THREE.Mesh(vortexGeo, vortexMat);
            vortexLeft.position.set(-16.5, 2.5, -11.1);
            const vortexRight = new THREE.Mesh(vortexGeo, vortexMat);
            vortexRight.position.set(-16.5, 2.5, 11.1);
            rwGroup.add(vortexLeft, vortexRight);

            grp.add(rwGroup);

            // 12. Double-Wishbone Carbon Aero Suspension + Pushrod/Pullrod Struts + 18-Inch Pirelli P-Zero Wheels + Over-Wheel Winglets
            const wheels = [];
            const brakeDiscMats = [];
            const wheelPositions = [
              { x: 21.8, y: 5.5, z: -15.6, isFront: true, r: 5.5, w: 6.4 },
              { x: 21.8, y: 5.5, z: 15.6, isFront: true, r: 5.5, w: 6.4 },
              { x: -20.5, y: 5.9, z: -16.2, isFront: false, r: 5.9, w: 7.8 },
              { x: -20.5, y: 5.9, z: 16.2, isFront: false, r: 5.9, w: 7.8 }
            ];

            // High-Resolution Pirelli P-Zero Tire Sidewall Texture with Compound Band, Eagle & Multi-Spoke Rim
            const swCan = document.createElement('canvas');
            swCan.width = 512;
            swCan.height = 512;
            const swCtx = swCan.getContext('2d');
            const tireGrad = swCtx.createRadialGradient(256, 256, 95, 256, 256, 254);
            tireGrad.addColorStop(0, '#05080f');
            tireGrad.addColorStop(0.55, '#131823');
            tireGrad.addColorStop(0.84, '#1b2230');
            tireGrad.addColorStop(1, '#090c12');
            swCtx.fillStyle = tireGrad;
            swCtx.beginPath();
            swCtx.arc(256, 256, 252, 0, Math.PI * 2);
            swCtx.fill();

            // Pirelli P-Zero Color Compound Ring + Dashed Sidewall Markings
            const ringCol = isWet3D ? '#38bdf8' : (spec.tireRing || '#ef4444');
            swCtx.strokeStyle = ringCol;
            swCtx.lineWidth = 18;
            swCtx.beginPath();
            swCtx.arc(256, 256, 192, 0.18, Math.PI - 0.18);
            swCtx.stroke();
            swCtx.beginPath();
            swCtx.arc(256, 256, 192, Math.PI + 0.18, Math.PI * 2 - 0.18);
            swCtx.stroke();

            swCtx.save();
            swCtx.translate(256, 256);
            swCtx.fillStyle = '#ffffff';
            swCtx.font = 'italic 900 30px "Chakra Petch", sans-serif';
            swCtx.textAlign = 'center';
            swCtx.fillText('PIRELLI', 0, -206);
            swCtx.fillStyle = ringCol;
            swCtx.fillText(isWet3D ? 'CINTURATO' : 'P ZERO', 0, 226);
            swCtx.restore();

            // 18-inch BBS / F1 Aero Wheel Cover with Team Color Flashes & Center Lock Nut
            swCtx.fillStyle = '#0c111c';
            swCtx.beginPath();
            swCtx.arc(256, 256, 138, 0, Math.PI * 2);
            swCtx.fill();
            swCtx.strokeStyle = '#64748b';
            swCtx.lineWidth = 8;
            swCtx.stroke();

            for (let spk = 0; spk < 10; spk++) {
              const ang = (spk / 10) * Math.PI * 2;
              swCtx.strokeStyle = (spk % 2 === 0) ? spec.accent : '#475569';
              swCtx.lineWidth = (spk % 2 === 0) ? 12 : 6;
              swCtx.beginPath();
              swCtx.moveTo(256 + Math.cos(ang) * 38, 256 + Math.sin(ang) * 38);
              swCtx.lineTo(256 + Math.cos(ang + 0.15) * 130, 256 + Math.sin(ang + 0.15) * 130);
              swCtx.stroke();
            }
            const tireSidewallTex = markSRGB(new THREE.CanvasTexture(swCan));
            const tireCapMat = new THREE.MeshStandardMaterial({
              map: tireSidewallTex,
              roughness: 0.35,
              metalness: 0.28
            });

            // Sculpted Curved Front Wheel-Wake Deflector (Over-Wheel Winglet mandatory on modern F1 cars)
            const deflectorPts = [
              [-2.2, 4.2], [4.2, 3.8], [4.8, 6.2], [0.8, 7.6], [-2.8, 6.8]
            ];
            const deflectorGeo = makeCenteredExtrude(deflectorPts, 1.35, 0.18, 0.18);

            for (const wp of wheelPositions) {
              const sDir = wp.z < 0 ? -1 : 1;
              // Upper & Lower A-Arm Carbon Wishbones (Front & Rear legs) + Diagonal Pushrod/Pullrod Strut
              for (const armY of [wp.y - 1.5, wp.y + 1.45]) {
                for (const armXOff of [-2.2, 2.2]) {
                  const wishbone = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.30, 12.2, 8), suspensionMat);
                  wishbone.rotation.x = Math.PI / 2;
                  wishbone.rotation.z = sDir * armXOff * 0.065;
                  wishbone.position.set(wp.x + armXOff * 0.65, armY, wp.z * 0.54);
                  grp.add(wishbone);
                }
              }
              const pushRod = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 13.4, 8), accentMat);
              pushRod.rotation.x = Math.PI / 2 + sDir * 0.34;
              pushRod.position.set(wp.x + (wp.isFront ? -0.9 : 0.9), wp.y + 1.5, wp.z * 0.54);
              grp.add(pushRod);

              const steerHub = new THREE.Group();
              steerHub.position.set(wp.x, wp.y, wp.z);

              // Stationary Carbon Brake Duct Scoop + Slotted Carbon-Ceramic Rotor + Brembo Brake Caliper
              const brakeDuct = new THREE.Mesh(new THREE.BoxGeometry(4.4, 5.2, 1.35), carbonMat);
              brakeDuct.position.set(0, 0, -sDir * (wp.w * 0.36));
              steerHub.add(brakeDuct);

              // Curved 3D Over-Wheel Wake Deflector Winglet on Front & Rear Uprights
              if (wp.isFront) {
                const wakeDeflector = new THREE.Mesh(deflectorGeo, carbonMat);
                wakeDeflector.position.set(-0.5, 0.4, -sDir * (wp.w * 0.42));
                const wakeAccent = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.32, 1.5), accentMat);
                wakeAccent.position.set(0.8, 7.1, -sDir * (wp.w * 0.42));
                wakeAccent.rotation.z = -0.22;
                steerHub.add(wakeDeflector, wakeAccent);
              } else {
                const rearDrumFin = new THREE.Mesh(new THREE.BoxGeometry(4.8, 1.8, 1.4), carbonMat);
                rearDrumFin.position.set(-1.8, 3.2, -sDir * (wp.w * 0.42));
                rearDrumFin.rotation.z = 0.28;
                steerHub.add(rearDrumFin);
              }

              const discMat = new THREE.MeshStandardMaterial({
                color: 0x334155,
                emissive: 0x000000,
                roughness: 0.32,
                metalness: 0.82
              });
              brakeDiscMats.push(discMat);
              const brakeDisc = new THREE.Mesh(new THREE.CylinderGeometry(wp.r * 0.62, wp.r * 0.62, wp.w * 0.45, 20), discMat);
              brakeDisc.rotation.x = Math.PI / 2;
              brakeDisc.position.set(0, 0, -sDir * 0.42);
              steerHub.add(brakeDisc);

              // High-Performance Brembo Brake Caliper
              const caliper = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 2.8, wp.w * 0.52),
                new THREE.MeshStandardMaterial({ color: isRedBull ? 0xe10600 : (isMerc ? 0x00a19b : 0xfacc15), metalness: 0.65, roughness: 0.22 })
              );
              caliper.position.set(-wp.r * 0.44, 0.5, -sDir * 0.42);
              steerHub.add(caliper);

              // Rotating Tire & 18" Rim Group
              const spinGrp = new THREE.Group();
              const tireCyl = new THREE.Mesh(
                new THREE.CylinderGeometry(wp.r, wp.r, wp.w, 32),
                [tireRubberMat, tireCapMat, tireCapMat]
              );
              tireCyl.rotation.x = Math.PI / 2;
              tireCyl.castShadow = true;
              tireCyl.receiveShadow = true;
              spinGrp.add(tireCyl);

              // Rounded Tire Shoulder Torus Rings for Authentic Bulbous F1 Pirelli Sidewall Profile
              for (const shSide of [-1, 1]) {
                const shoulderTorus = new THREE.Mesh(
                  new THREE.TorusGeometry(wp.r * 0.87, wp.r * 0.135, 12, 28),
                  tireRubberMat
                );
                shoulderTorus.position.set(0, 0, shSide * (wp.w * 0.44));
                spinGrp.add(shoulderTorus);
              }

              // Outer Metallic Wheel Rim Lip + Anodized Center Lock Nut
              const outerRimLip = new THREE.Mesh(
                new THREE.TorusGeometry(wp.r * 0.56, 0.32, 10, 24),
                alloyRimMat
              );
              outerRimLip.position.set(0, 0, sDir * (wp.w * 0.505));
              spinGrp.add(outerRimLip);

              const centerLock = new THREE.Mesh(
                new THREE.CylinderGeometry(1.05, 1.05, wp.w + 0.85, 14),
                new THREE.MeshStandardMaterial({
                  color: sDir < 0 ? 0xe10600 : 0x2563eb,
                  metalness: 0.88,
                  roughness: 0.16
                })
              );
              centerLock.rotation.x = Math.PI / 2;
              spinGrp.add(centerLock);

              steerHub.add(spinGrp);
              grp.add(steerHub);
              wheels.push({ steerHub, spinGrp, isFront: wp.isFront });
            }

            grp.userData = {
              wheels,
              rwFlap,
              vortexMat,
              brakeLightMat,
              brakeDiscMats,
              exhaustFlame,
              flameMat,
              steeringWheelGrp,
              swLedStrip,
              swScreenCan,
              swScreenCtx,
              swScreenTex,
              helmet,
              visor,
              headGrp,
              ponytailGrp,
              driverGrp,
              haloMain,
              haloPillar
            };
            scene.add(grp);
            return grp;
          };

          st.carMeshes = {};
          for (const item of F1_GRID_ROSTER) {
            st.carMeshes[item.id] = createF1CarMesh(item.id);
          }

          // 9. Pool of 3D Skid Mark Decals on the Tarmac
          st.skidPool = [];
          const skidGeo = new THREE.PlaneGeometry(18, 3.2);
          skidGeo.rotateX(-Math.PI / 2);
          const skidMat = new THREE.MeshBasicMaterial({
            color: 0x070a12,
            transparent: true,
            opacity: 0.46,
            depthWrite: false
          });
          for (let i = 0; i < 95; i++) {
            const smMesh = new THREE.Mesh(skidGeo, skidMat);
            smMesh.visible = false;
            scene.add(smMesh);
            st.skidPool.push(smMesh);
          }

          // 10. Pool of 3D Volumetric Smoke & Titanium Spark Particles
          st.particlePool = [];
          const pGeo = new THREE.DodecahedronGeometry(3.0, 1);
          for (let i = 0; i < 70; i++) {
            const pMat = new THREE.MeshStandardMaterial({
              color: 0xf1f5f9,
              emissive: 0x000000,
              roughness: 0.85,
              transparent: true,
              opacity: 0.72
            });
            const pMesh = new THREE.Mesh(pGeo, pMat);
            pMesh.visible = false;
            scene.add(pMesh);
            st.particlePool.push(pMesh);
          }

          st.scene = scene;
          st.builtTrackLevel = track.level;
          st.builtWeatherWet = isWet3D;
          st.builtDriverGender = activeGender3D;
        }

        // Update 5 FIA Gantry Start Lights during countdown
        if (st.gantryLights && st.gantryLights.length === 5) {
          const cdStage = countdownStageRef.current;
          const tRem = countdownTimerRef.current;
          st.gantryLights.forEach((bMat, idx) => {
            if (tRem <= -0.6) {
              bMat.color.setHex(0x14532d);
            } else if (cdStage === 0) {
              bMat.color.setHex(0x00e676);
            } else {
              const litCount = cdStage === 3 ? 2 : cdStage === 2 ? 4 : 5;
              bMat.color.setHex(idx < litCount ? 0xff0022 : 0x3b0707);
            }
          });
        }

        // Update 3D F1 Cars (Position, Pitch/Roll suspension physics, Steering Wheel rotation, Glowing Brake Discs & Afterburners)
        for (const car of racers) {
          const mesh = st.carMeshes[car.id];
          if (!mesh) continue;
          mesh.position.set(car.x, 0.65, car.y);
          mesh.rotation.y = -car.heading;
          const accelDelta = (car.speed - (car.prevSpeed || 0));
          const pitchAngle = clamp(car.isBraking ? -0.028 : accelDelta * 0.0022, -0.035, 0.028);
          const rollAngle = car.drifting ? 0.048 : 0;
          mesh.rotation.z = pitchAngle;
          mesh.rotation.x = rollAngle;
          mesh.visible = !(car.invulnerableTimer > 0 && Math.floor(Date.now() / 80) % 2 === 0);

          const ud = mesh.userData;
          if (ud.rwFlap) {
            ud.rwFlap.rotation.z = car.drsActive ? -0.02 : 0.24;
          }
          if (ud.vortexMat) {
            const vOpacity = (car.drsActive || car.speed > 265) ? clamp((car.speed - 250) / 360, 0.12, 0.42) : 0.0;
            ud.vortexMat.opacity = vOpacity;
          }
          if (ud.brakeLightMat) {
            ud.brakeLightMat.color.setHex(
              car.isBraking ? 0xff0033 : (Math.floor(Date.now() / (isWet3D ? 85 : 130)) % 2 === 0 ? 0xef4444 : 0x450a0a)
            );
          }
          if (ud.brakeDiscMats) {
            const glowHex = car.isBraking && car.speed > 110 ? 0xff3b00 : 0x000000;
            for (const dm of ud.brakeDiscMats) {
              dm.emissive.setHex(glowHex);
            }
          }
          if (ud.helmet) ud.helmet.visible = true;
          if (ud.visor) ud.visor.visible = true;
          if (ud.haloPillar) ud.haloPillar.visible = true;
          if (ud.haloMain) ud.haloMain.visible = true;
          if (ud.steeringWheelGrp) {
            ud.steeringWheelGrp.visible = true;
            if (!car.isPlayer) {
              ud.steeringWheelGrp.rotation.x = Math.sin(Date.now() * 0.008 + car.x * 0.02) * 0.14;
            }
          }
          if (ud.headGrp) {
            const steerLean = car.isPlayer ? -(car.steerWheelAngle || 0) * 0.35 : Math.sin(Date.now() * 0.006 + car.y * 0.01) * 0.12;
            ud.headGrp.rotation.x = clamp(steerLean, -0.22, 0.22);
            ud.headGrp.rotation.y = clamp(steerLean * 0.65, -0.18, 0.18);
          }
          if (ud.ponytailGrp) {
            const windFlutter = Math.abs(car.speed) > 40 ? Math.sin(Date.now() * 0.038 + car.x) * 0.14 * clamp(Math.abs(car.speed) / 400, 0.2, 1.2) : 0;
            ud.ponytailGrp.rotation.y = windFlutter;
            ud.ponytailGrp.rotation.z = Math.abs(windFlutter) * 0.45;
          }

          if (ud.steeringWheelGrp && car.isPlayer) {
            const roadVib = Math.abs(car.speed) > 80 ? Math.sin(Date.now() * 0.045) * 0.012 * (Math.abs(car.speed) / 820) : 0;
            ud.steeringWheelGrp.rotation.x = -(car.steerWheelAngle || 0) + roadVib;
            const spdKmh = Math.round(Math.max(0, car.speed * 0.45));
            const gNum = spdKmh < 4 ? 'N' : Math.min(8, Math.max(1, Math.ceil(spdKmh / 45)));
            const rpmRat = clamp((spdKmh % 48) / 45, spdKmh > 330 ? 0.92 : 0.15, 1);
            if (ud.swLedStrip) {
              ud.swLedStrip.material.color.setHex(rpmRat > 0.86 ? 0xd946ef : rpmRat > 0.58 ? 0xe10600 : 0x10b981);
            }
            if (ud.swScreenCtx && ud.swScreenTex) {
              const sx = ud.swScreenCtx;
              sx.fillStyle = '#060a12';
              sx.fillRect(0, 0, 256, 128);
              sx.strokeStyle = '#334155';
              sx.lineWidth = 4;
              sx.strokeRect(2, 2, 252, 124);

              // Top 12-LED RPM Bar on LCD
              const litN = spdKmh < 3 ? 0 : Math.round(rpmRat * 12);
              for (let li = 0; li < 12; li++) {
                sx.fillStyle = li < litN ? (li < 4 ? '#10b981' : li < 8 ? '#e10600' : '#d946ef') : '#1e293b';
                sx.fillRect(10 + li * 20, 10, 16, 12);
              }

              // Left Position & Lap
              sx.fillStyle = '#94a3b8';
              sx.font = 'bold 16px monospace';
              sx.textAlign = 'left';
              const pIdx = racePositionsRef.current.indexOf(car.id);
              sx.fillText(`P${pIdx !== -1 ? pIdx + 1 : 1}/${racers.length}`, 14, 52);
              sx.fillStyle = '#38bdf8';
              sx.fillText(`T${Math.min(track.totalLaps || 2, car.lap + 1)}/${track.totalLaps || 2}`, 14, 78);

              // Center Giant Gear Number
              sx.fillStyle = car.drsActive ? '#38bdf8' : '#facc15';
              sx.font = 'bold 64px sans-serif';
              sx.textAlign = 'center';
              sx.fillText(String(gNum), 128, 92);

              // Right Speed in KM/S
              sx.fillStyle = '#ffffff';
              sx.font = 'bold 30px monospace';
              sx.textAlign = 'right';
              sx.fillText(`${spdKmh}`, 242, 66);
              sx.fillStyle = car.drsActive ? '#38bdf8' : '#10b981';
              sx.font = 'bold 14px sans-serif';
              sx.fillText(car.drsActive ? 'DRS' : 'KM/S', 242, 88);

              // Bottom ERS Battery Bar
              sx.fillStyle = '#1e293b';
              sx.fillRect(14, 108, 228, 8);
              sx.fillStyle = car.drsActive ? '#38bdf8' : '#10b981';
              sx.fillRect(14, 108, Math.round(228 * clamp((car.ers ?? 100) / 100, 0, 1)), 8);
              ud.swScreenTex.needsUpdate = true;
            }
          }
          if (ud.exhaustFlame && ud.flameMat) {
            const showFlame = car.drsActive || (car.speed > 250 && Math.random() < 0.45) || (car.isBraking && car.speed > 170 && Math.random() < 0.58);
            ud.flameMat.opacity = showFlame ? (0.58 + Math.random() * 0.4) : 0.0;
            ud.flameMat.color.setHex(Math.random() > 0.35 ? 0x38bdf8 : 0xff6d00);
            const fScale = 0.75 + Math.random() * 0.7;
            ud.exhaustFlame.scale.set(1, fScale, 1);
          }
          if (ud.wheels) {
            const spinAngle = (car.totalDistance || 0) * 0.19;
            ud.wheels.forEach(wObj => {
              wObj.spinGrp.rotation.z = -spinAngle;
              if (wObj.isFront) {
                wObj.steerHub.rotation.y = (car.isPlayer ? -((cam.sway || 0) * 0.026) : 0);
              }
            });
          }
        }

        // Sync 3D Skid Marks onto Tarmac
        const skids = skidMarksRef.current;
        for (let i = 0; i < st.skidPool.length; i++) {
          const smMesh = st.skidPool[i];
          if (i < skids.length) {
            const sm = skids[skids.length - 1 - i];
            const mx = (sm.x1 + sm.x2) * 0.5;
            const mz = (sm.y1 + sm.y2) * 0.5;
            const ang = Math.atan2(sm.y2 - sm.y1, sm.x2 - sm.x1);
            smMesh.visible = true;
            smMesh.position.set(mx, 1.25, mz);
            smMesh.rotation.y = -ang;
          } else {
            smMesh.visible = false;
          }
        }

        // Sync 3D Volumetric Particles (Tire Smoke, Titanium Sparks, Exhaust Flames)
        const activeParts = particlesRef.current;
        for (let i = 0; i < st.particlePool.length; i++) {
          const pm = st.particlePool[i];
          if (i < activeParts.length) {
            const p = activeParts[i];
            pm.visible = true;
            pm.position.set(p.x, 3.2 + (1 - p.alpha) * 10, p.y);
            const sc = Math.max(0.35, p.size * (p.type === 'smoke' ? 0.52 : 0.34));
            pm.scale.set(sc, sc * 0.85, sc);
            pm.rotation.x += 0.08;
            pm.rotation.y += 0.11;
            pm.material.color.set(p.color || '#f1f5f9');
            if (p.type === 'spark' || p.type === 'flame') {
              pm.material.emissive.set(p.color || '#facc15');
            } else {
              pm.material.emissive.setHex(0x000000);
            }
            pm.material.opacity = clamp(p.alpha * 0.85, 0.08, 0.88);
          } else {
            pm.visible = false;
          }
        }

        // Update Dynamic Shadow Camera snapped to 16-unit grid increments so shadows never shimmer
        const px = player ? player.x : cam.x;
        const pz = player ? player.y : cam.y;
        if (st.sunLight) {
          const snapX = Math.round(px / 16) * 16;
          const snapZ = Math.round(pz / 16) * 16;
          st.sunLight.position.set(snapX + 340, 520, snapZ - 280);
          st.sunLight.target.position.set(snapX, 0, snapZ);
          st.sunLight.target.updateMatrixWorld();
        }

        // Broadcast-Grade Close-Up 3D F1 Chase Camera (Showcases Sculpted Car Aero, Diffuser, Halo & Track Detail)
        const speedRatioFov = player ? clamp(Math.abs(player.speed) / 820, 0, 1) : 0;
        const baseFov = 55;
        const desiredFov = baseFov + speedRatioFov * 10.5 + (player && player.drsActive ? 3.0 : 0);
        if (Math.abs(st.camera.fov - desiredFov) > 0.12) {
          st.camera.fov += (desiredFov - st.camera.fov) * 0.25;
          st.camera.updateProjectionMatrix();
        }

        const cam3DDist = 88;
        const cam3DHeight = 29.5;
        const microVibY = speedRatioFov > 0.35 ? Math.sin(Date.now() * 0.055) * 0.18 * speedRatioFov : 0;
        const eyeX = px - cosA * cam3DDist - sinA * (cam.sway || 0) * 0.32;
        const eyeY = cam3DHeight + microVibY;
        const eyeZ = pz - sinA * cam3DDist + cosA * (cam.sway || 0) * 0.32;
        const lookAheadDist = 92;
        const lookX = px + cosA * lookAheadDist;
        const lookY = 9.5;
        const lookZ = pz + sinA * lookAheadDist;

        st.camera.position.set(eyeX, eyeY, eyeZ);
        st.camera.lookAt(lookX, lookY, lookZ);

        st.renderer.render(st.scene, st.camera);
        ctx.drawImage(st.renderer.domElement, 0, 0, canvasWidth, canvasHeight);
        window.__3D_RENDER_OK__ = true;
        return true;
      } catch (err) {
        console.error('3D WebGL Render Error:', err);
        window.__3D_RENDER_ERR__ = err;
        return false;
      }
    };

    ctx.save();
    let handledView = false;
    if (viewModeRef.current === '2D') {
      render2DTopDown();
      handledView = true;
    } else if (viewModeRef.current === '3D') {
      handledView = renderReal3DWebGL();
    }
    if (!handledView) {

    // --- 1. SKY & FLUFFY CLOUDS & DISTANT MOUNTAINS / HILLS HORIZON (matching 30498.jpg) ---
    const isDarkBiome = ['#090d16', '#020617', '#18181b', '#111827', '#1e1b4b', '#270909', '#2e1065'].includes(biome.tileDark);
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
    if (isDarkBiome) {
      skyGrad.addColorStop(0, '#090d16');
      skyGrad.addColorStop(0.55, '#1e293b');
      skyGrad.addColorStop(1, '#38bdf8');
    } else {
      skyGrad.addColorStop(0, '#1d74d8');
      skyGrad.addColorStop(0.58, '#4ba3f5');
      skyGrad.addColorStop(1, '#bae6fd');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvasWidth, horizonY + 2);

    // Parallax scrolling based on camera heading
    const normHeading = ((camAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const skyPeriod = 1600;
    const skyScroll = (normHeading / (Math.PI * 2)) * skyPeriod;

    // Fluffy pixel-art clouds along the horizon
    const drawCloudCluster = (baseX, baseY, scaleC) => {
      const puffs = [
        { dx: -56, dy: 8, r: 24 },
        { dx: -28, dy: -6, r: 34 },
        { dx: 8, dy: -14, r: 40 },
        { dx: 44, dy: -4, r: 30 },
        { dx: 72, dy: 10, r: 22 }
      ];
      // Cloud shadow base
      ctx.fillStyle = isDarkBiome ? '#64748b' : '#cbd5e1';
      ctx.beginPath();
      for (const pf of puffs) {
        ctx.arc(baseX + pf.dx * scaleC, baseY + (pf.dy + 7) * scaleC, pf.r * scaleC, 0, Math.PI * 2);
      }
      ctx.fill();
      // Main bright cloud body
      ctx.fillStyle = isDarkBiome ? '#e2e8f0' : '#ffffff';
      ctx.beginPath();
      for (const pf of puffs) {
        ctx.arc(baseX + pf.dx * scaleC, baseY + pf.dy * scaleC, pf.r * scaleC, 0, Math.PI * 2);
      }
      ctx.fill();
      // Crisp top highlight
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      for (const pf of puffs) {
        ctx.arc(baseX + (pf.dx - 3) * scaleC, baseY + (pf.dy - 4) * scaleC, pf.r * 0.72 * scaleC, 0, Math.PI * 2);
      }
      ctx.fill();
    };

    const cloudDefs = [
      { x: 110, y: horizonY - 76, s: 1.15 },
      { x: 370, y: horizonY - 94, s: 1.35 },
      { x: 660, y: horizonY - 72, s: 1.05 },
      { x: 940, y: horizonY - 88, s: 1.28 },
      { x: 1240, y: horizonY - 78, s: 1.12 },
      { x: 1490, y: horizonY - 92, s: 1.22 }
    ];
    for (let rep = -1; rep <= 1; rep++) {
      for (const cd of cloudDefs) {
        const cx = cd.x - (skyScroll * 0.65 % skyPeriod) + rep * skyPeriod;
        if (cx > -220 && cx < canvasWidth + 220) {
          drawCloudCluster(cx, cd.y, cd.s);
        }
      }
    }

    // Distant mountain range silhouette
    ctx.fillStyle = isDarkBiome ? '#1e293b' : '#5b82a6';
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    const mtnPeaks = [0, 95, 190, 310, 420, 540, 670, 790, 920, 1050, 1180, 1310, 1450, 1600];
    const mtnHeights = [46, 82, 54, 96, 48, 78, 62, 92, 44, 84, 58, 74, 50, 46];
    for (let rep = -1; rep <= 1; rep++) {
      for (let i = 0; i < mtnPeaks.length; i++) {
        const mx = mtnPeaks[i] - (skyScroll * 0.85 % skyPeriod) + rep * skyPeriod;
        const my = horizonY - mtnHeights[i];
        ctx.lineTo(mx, my);
      }
    }
    ctx.lineTo(canvasWidth, horizonY);
    ctx.closePath();
    ctx.fill();

    // Mountain sunlit ridges
    ctx.fillStyle = isDarkBiome ? '#334155' : '#7ba0c2';
    for (let rep = -1; rep <= 1; rep++) {
      for (let i = 0; i < mtnPeaks.length - 1; i += 2) {
        const mx1 = mtnPeaks[i] - (skyScroll * 0.85 % skyPeriod) + rep * skyPeriod;
        const my1 = horizonY - mtnHeights[i];
        const mx2 = mtnPeaks[i + 1] - (skyScroll * 0.85 % skyPeriod) + rep * skyPeriod;
        const my2 = horizonY - mtnHeights[i + 1];
        if (mx2 > 0 && mx1 < canvasWidth) {
          ctx.beginPath();
          ctx.moveTo(mx1, horizonY);
          ctx.lineTo(mx2, my2);
          ctx.lineTo(mx2, horizonY);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    // Green/biome rolling foothills & distant treeline at horizon
    ctx.fillStyle = isDarkBiome ? biome.tileLight : '#2e7d32';
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    for (let sx = 0; sx <= canvasWidth + 40; sx += 32) {
      const worldX = sx + skyScroll;
      const hillH = 14 + Math.sin(worldX * 0.008) * 9 + Math.cos(worldX * 0.019) * 5;
      ctx.lineTo(sx, horizonY - Math.max(4, hillH));
    }
    ctx.lineTo(canvasWidth, horizonY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = isDarkBiome ? biome.tileSpecLight : '#4caf50';
    ctx.fillRect(0, horizonY - 4, canvasWidth, 4);

    // --- 2. PERSPECTIVE GROUND PLANE (classic 16-bit OutRun / Super Monaco GP horizontal distance bands) ---
    const groundH = canvasHeight - horizonY;
    ctx.fillStyle = biome.tileDark;
    ctx.fillRect(0, horizonY, canvasWidth, groundH);

    const zBandSize = 70;
    const camForwardScroll = player ? (player.totalDistance || 0) : 0;
    let prevScreenY = horizonY;
    for (let py = 2; py <= groundH; py += 3) {
      const sy = horizonY + py;
      const worldZ = (camHeight * focalLength) / Math.max(1, py);
      const bandIdx = Math.floor((worldZ + camForwardScroll) / zBandSize);
      const isLightBand = (bandIdx & 1) === 0;
      ctx.fillStyle = isLightBand ? biome.tileLight : biome.tileDark;
      ctx.fillRect(0, prevScreenY, canvasWidth, sy - prevScreenY + 1);
      prevScreenY = sy;
    }

    // --- 3. 3D CAMERA PROJECTION HELPERS ---
    const toCamSpace = (wx, wy) => {
      const dx = wx - camX;
      const dy = wy - camY;
      return {
        forward: dx * cosA + dy * sinA,
        right: -dx * sinA + dy * cosA
      };
    };

    const projectCamPt = (forward, right, wz = 0) => {
      const scale = focalLength / forward;
      return {
        x: centerX + right * scale,
        y: horizonY + (camHeight - wz) * scale,
        scale
      };
    };

    const fillProjectedQuad = (w1x, w1y, w2x, w2y, w3x, w3y, w4x, w4y, color) => {
      const c1 = toCamSpace(w1x, w1y);
      const c2 = toCamSpace(w2x, w2y);
      const c3 = toCamSpace(w3x, w3y);
      const c4 = toCamSpace(w4x, w4y);
      if (c1.forward < nearClip && c2.forward < nearClip && c3.forward < nearClip && c4.forward < nearClip) return;
      if (c1.forward > farClip && c2.forward > farClip && c3.forward > farClip && c4.forward > farClip) return;

      const pts = [c1, c2, c3, c4];
      const clipped = [];
      for (let i = 0; i < 4; i++) {
        const curr = pts[i];
        const next = pts[(i + 1) % 4];
        const currIn = curr.forward >= nearClip;
        const nextIn = next.forward >= nearClip;
        if (currIn) clipped.push(curr);
        if (currIn !== nextIn) {
          const t = (nearClip - curr.forward) / (next.forward - curr.forward);
          clipped.push({
            forward: nearClip,
            right: curr.right + (next.right - curr.right) * t
          });
        }
      }
      if (clipped.length < 3) return;
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < clipped.length; i++) {
        const sp = projectCamPt(clipped[i].forward, clipped[i].right, 0);
        if (i === 0) ctx.moveTo(sp.x, sp.y);
        else ctx.lineTo(sp.x, sp.y);
      }
      ctx.closePath();
      ctx.fill();
    };

    // --- 4. COLLECT & SORT 3D TRACK SEGMENTS (Painter's Algorithm Back-to-Front) ---

    const visibleSegments = [];
    for (let i = 0; i < totalSamples; i++) {
      const p1 = samples[i];
      const p2 = samples[(i + 1) % totalSamples];
      const c1 = toCamSpace(p1.x, p1.y);
      const c2 = toCamSpace(p2.x, p2.y);
      const maxF = Math.max(c1.forward, c2.forward);
      const minF = Math.min(c1.forward, c2.forward);
      if (maxF < nearClip || minF > farClip) continue;
      const avgR = (c1.right + c2.right) * 0.5;
      const avgF = (c1.forward + c2.forward) * 0.5;
      if (avgF > 120 && Math.abs(avgR) > avgF * 2.6 + 380) continue;
      visibleSegments.push({
        idx: i,
        p1,
        p2,
        depth: avgF
      });
    }

    visibleSegments.sort((a, b) => b.depth - a.depth);

    for (const seg of visibleSegments) {
      const { idx, p1, p2 } = seg;
      // Gravel runoff on corners
      if (p1.curvature > 0.032 || p2.curvature > 0.032) {
        fillProjectedQuad(
          p1.x + p1.nx * (halfRoad + curbW), p1.y + p1.ny * (halfRoad + curbW),
          p1.x + p1.nx * (halfRoad + curbW + gravelWidth), p1.y + p1.ny * (halfRoad + curbW + gravelWidth),
          p2.x + p2.nx * (halfRoad + curbW + gravelWidth), p2.y + p2.ny * (halfRoad + curbW + gravelWidth),
          p2.x + p2.nx * (halfRoad + curbW), p2.y + p2.ny * (halfRoad + curbW),
          biome.gravel
        );
        fillProjectedQuad(
          p1.x - p1.nx * (halfRoad + curbW + gravelWidth), p1.y - p1.ny * (halfRoad + curbW + gravelWidth),
          p1.x - p1.nx * (halfRoad + curbW), p1.y - p1.ny * (halfRoad + curbW),
          p2.x - p2.nx * (halfRoad + curbW), p2.y - p2.ny * (halfRoad + curbW),
          p2.x - p2.nx * (halfRoad + curbW + gravelWidth), p2.y - p2.ny * (halfRoad + curbW + gravelWidth),
          biome.gravel
        );
      }

      // Alternating red/white 3D curbs (rumble strips)
      const isCurbA = Math.floor(idx / 4) % 2 === 0;
      const curbColor = isCurbA ? biome.curbA : biome.curbB;
      fillProjectedQuad(
        p1.x + p1.nx * halfRoad, p1.y + p1.ny * halfRoad,
        p1.x + p1.nx * (halfRoad + curbW), p1.y + p1.ny * (halfRoad + curbW),
        p2.x + p2.nx * (halfRoad + curbW), p2.y + p2.ny * (halfRoad + curbW),
        p2.x + p2.nx * halfRoad, p2.y + p2.ny * halfRoad,
        curbColor
      );
      fillProjectedQuad(
        p1.x - p1.nx * (halfRoad + curbW), p1.y - p1.ny * (halfRoad + curbW),
        p1.x - p1.nx * halfRoad, p1.y - p1.ny * halfRoad,
        p2.x - p2.nx * halfRoad, p2.y - p2.ny * halfRoad,
        p2.x - p2.nx * (halfRoad + curbW), p2.y - p2.ny * (halfRoad + curbW),
        curbColor
      );

      // Main asphalt tarmac surface (slightly alternating shade for high-speed motion sensation)
      const tarmacShade = biome.tarmac;
      fillProjectedQuad(
        p1.x - p1.nx * halfRoad, p1.y - p1.ny * halfRoad,
        p1.x + p1.nx * halfRoad, p1.y + p1.ny * halfRoad,
        p2.x + p2.nx * halfRoad, p2.y + p2.ny * halfRoad,
        p2.x - p2.nx * halfRoad, p2.y - p2.ny * halfRoad,
        tarmacShade
      );

      // Subtle dark racing grooves
      const grooveOff = halfRoad * 0.44;
      const grooveHalf = 8;
      fillProjectedQuad(
        p1.x + p1.nx * (grooveOff - grooveHalf), p1.y + p1.ny * (grooveOff - grooveHalf),
        p1.x + p1.nx * (grooveOff + grooveHalf), p1.y + p1.ny * (grooveOff + grooveHalf),
        p2.x + p2.nx * (grooveOff + grooveHalf), p2.y + p2.ny * (grooveOff + grooveHalf),
        p2.x + p2.nx * (grooveOff - grooveHalf), p2.y + p2.ny * (grooveOff - grooveHalf),
        biome.racingLine
      );
      fillProjectedQuad(
        p1.x - p1.nx * (grooveOff + grooveHalf), p1.y - p1.ny * (grooveOff + grooveHalf),
        p1.x - p1.nx * (grooveOff - grooveHalf), p1.y - p1.ny * (grooveOff - grooveHalf),
        p2.x - p2.nx * (grooveOff - grooveHalf), p2.y - p2.ny * (grooveOff - grooveHalf),
        p2.x - p2.nx * (grooveOff + grooveHalf), p2.y - p2.ny * (grooveOff + grooveHalf),
        biome.racingLine
      );

      // Crisp white track edge lines
      const edgeW = 3.5;
      fillProjectedQuad(
        p1.x + p1.nx * (halfRoad - edgeW), p1.y + p1.ny * (halfRoad - edgeW),
        p1.x + p1.nx * halfRoad, p1.y + p1.ny * halfRoad,
        p2.x + p2.nx * halfRoad, p2.y + p2.ny * halfRoad,
        p2.x + p2.nx * (halfRoad - edgeW), p2.y + p2.ny * (halfRoad - edgeW),
        '#ffffff'
      );
      fillProjectedQuad(
        p1.x - p1.nx * halfRoad, p1.y - p1.ny * halfRoad,
        p1.x - p1.nx * (halfRoad - edgeW), p1.y - p1.ny * (halfRoad - edgeW),
        p2.x - p2.nx * (halfRoad - edgeW), p2.y - p2.ny * (halfRoad - edgeW),
        p2.x - p2.nx * halfRoad, p2.y - p2.ny * halfRoad,
        '#ffffff'
      );

      // Center dashed lane divider
      if (Math.floor(idx / 3) % 2 === 0) {
        const dashHalf = 2.5;
        fillProjectedQuad(
          p1.x - p1.nx * dashHalf, p1.y - p1.ny * dashHalf,
          p1.x + p1.nx * dashHalf, p1.y + p1.ny * dashHalf,
          p2.x + p2.nx * dashHalf, p2.y + p2.ny * dashHalf,
          p2.x - p2.nx * dashHalf, p2.y - p2.ny * dashHalf,
          'rgba(241, 245, 249, 0.55)'
        );
      }

      // Checkered Start / Finish Line at idx 0..1
      if (idx === 0 || idx === 1) {
        const checkSlices = 10;
        for (let c = 0; c < checkSlices; c++) {
          const tA = -halfRoad + (c / checkSlices) * track.trackWidth;
          const tB = -halfRoad + ((c + 1) / checkSlices) * track.trackWidth;
          const isBlack = (idx + c) % 2 === 0;
          fillProjectedQuad(
            p1.x + p1.nx * tA, p1.y + p1.ny * tA,
            p1.x + p1.nx * tB, p1.y + p1.ny * tB,
            p2.x + p2.nx * tB, p2.y + p2.ny * tB,
            p2.x + p2.nx * tA, p2.y + p2.ny * tA,
            isBlack ? '#090d16' : '#ffffff'
          );
        }
      }
    }

    // --- 5. SKID MARKS IN 3D PERSPECTIVE ---
    for (const sm of skidMarksRef.current) {
      const c1 = toCamSpace(sm.x1, sm.y1);
      const c2 = toCamSpace(sm.x2, sm.y2);
      if (c1.forward < nearClip || c2.forward < nearClip || c1.forward > 1400) continue;
      const s1 = projectCamPt(c1.forward, c1.right, 0);
      const s2 = projectCamPt(c2.forward, c2.right, 0);
      ctx.strokeStyle = `rgba(15, 23, 42, ${sm.alpha})`;
      ctx.lineWidth = Math.max(1.5, Math.min(8, s1.scale * 4.5));
      ctx.beginPath();
      ctx.moveTo(s1.x, s1.y);
      ctx.lineTo(s2.x, s2.y);
      ctx.stroke();
    }

    // --- 6. COLLECT & DEPTH-SORT 3D PROPS, PARTICLES & F1 CARS ---
    const renderQueue = [];

    if (track.decorations) {
      for (const dec of track.decorations) {
        const c = toCamSpace(dec.x, dec.y);
        if (c.forward < nearClip || c.forward > farClip * 0.85) continue;
        if (Math.abs(c.right) > c.forward * 2.2 + 260) continue;
        renderQueue.push({ kind: 'dec', depth: c.forward, right: c.right, dec });
      }
    }

    for (const p of particlesRef.current) {
      const c = toCamSpace(p.x, p.y);
      if (c.forward < nearClip || c.forward > 1800) continue;
      renderQueue.push({ kind: 'particle', depth: c.forward, right: c.right, p });
    }

    for (const car of racers) {
      const c = toCamSpace(car.x, car.y);
      if (c.forward < nearClip * 0.7 || c.forward > farClip) continue;
      renderQueue.push({ kind: 'car', depth: Math.max(nearClip, c.forward), right: c.right, car });
    }

    renderQueue.sort((a, b) => b.depth - a.depth);

    // Helper to draw a 3D F1 car in the behind-the-car chase perspective (matching 30498.jpg)
    const drawCar3DChase = (car, sx, sy, scale, relAngle) => {
      const livery = LIVERIES[car.id] || LIVERIES.player;
      const yaw = clamp(Math.sin(relAngle) * 1.15, -1, 1);
      const shift = yaw * 26;
      const carScale = Math.max(0.08, Math.min(2.6, scale * 1.55));

      ctx.save();
      ctx.translate(sx, sy);
      if (car.invulnerableTimer > 0 && Math.floor(Date.now() / 80) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }
      ctx.scale(carScale, carScale);

      // Ground contact shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.beginPath();
      ctx.ellipse(shift * 0.25, 2, 46, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      // Front wheels (further forward in perspective, slightly narrower & higher on screen)
      const drawTire3D = (tx, ty, tw, th, isRear) => {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(tx - tw * 0.5, ty - th, tw, th);
        // Tire tread & shoulder highlight
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(tx - tw * 0.5 + 1.5, ty - th + 1.5, tw - 3, th - 3);
        ctx.fillStyle = '#334155';
        ctx.fillRect(tx - tw * 0.36, ty - th + 2, tw * 0.72, 3);
        // Sidewall compound stripe
        ctx.fillStyle = livery.tireCompound;
        ctx.fillRect(tx - tw * 0.5 + 1, ty - th + 3, 2, th - 6);
        ctx.fillRect(tx + tw * 0.5 - 3, ty - th + 3, 2, th - 6);
        if (isRear) {
          // Outer wheel rim glow when angled
          ctx.fillStyle = '#64748b';
          ctx.fillRect(tx - 2, ty - th * 0.6, 4, 4);
        }
      };

      const frontWheelOffset = 31;
      const frontY = -12;
      drawTire3D(shift * 0.85 - frontWheelOffset, frontY, 13, 18, false);
      drawTire3D(shift * 0.85 + frontWheelOffset, frontY, 13, 18, false);

      // Front wing tips visible when car turns or at an angle
      ctx.fillStyle = livery.accent;
      ctx.fillRect(shift * 0.95 - 36, frontY - 4, 72, 3);
      ctx.fillStyle = livery.primaryDark;
      ctx.fillRect(shift * 0.95 - 34, frontY - 7, 68, 3);

      // Front suspension wishbones
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(shift * 0.55 - 10, -19);
      ctx.lineTo(shift * 0.85 - frontWheelOffset + 4, frontY - 9);
      ctx.moveTo(shift * 0.55 + 10, -19);
      ctx.lineTo(shift * 0.85 + frontWheelOffset - 4, frontY - 9);
      ctx.stroke();

      // Sidepods & floor aero blades
      ctx.fillStyle = '#090d16';
      ctx.fillRect(shift * 0.35 - 30, -8, 60, 5);
      ctx.fillStyle = livery.primaryDark;
      ctx.beginPath();
      ctx.moveTo(shift * 0.25 - 26, -6);
      ctx.lineTo(shift * 0.6 - 24, -22);
      ctx.lineTo(shift * 0.6 + 24, -22);
      ctx.lineTo(shift * 0.25 + 26, -6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = livery.primary;
      ctx.fillRect(shift * 0.4 - 24, -20, 48, 12);
      // Sidepod radiator intakes
      ctx.fillStyle = '#020617';
      ctx.fillRect(shift * 0.45 - 21, -18, 9, 6);
      ctx.fillRect(shift * 0.45 + 12, -18, 9, 6);
      // Sidepod accent stripe
      ctx.fillStyle = livery.accent;
      ctx.fillRect(shift * 0.4 - 23, -11, 46, 2.5);

      // Engine cover & central airbox / roll hoop
      ctx.fillStyle = livery.primary;
      ctx.beginPath();
      ctx.moveTo(shift * 0.2 - 11, -14);
      ctx.lineTo(shift * 0.55 - 5, -35);
      ctx.lineTo(shift * 0.55 + 5, -35);
      ctx.lineTo(shift * 0.2 + 11, -14);
      ctx.closePath();
      ctx.fill();

      // Shark fin & livery dorsal stripe
      ctx.fillStyle = livery.accent;
      ctx.beginPath();
      ctx.moveTo(shift * 0.15, -16);
      ctx.lineTo(shift * 0.52, -35);
      ctx.lineTo(shift * 0.52 + 2.5, -35);
      ctx.lineTo(shift * 0.15 + 2.5, -16);
      ctx.closePath();
      ctx.fill();

      // Cockpit halo, FIA F1 Racing Suit Shoulders, Epaulettes & Driver Helmet (Male/Female)
      ctx.fillStyle = '#020617';
      ctx.fillRect(shift * 0.58 - 8, -30, 16, 7);
      // FIA F1 Suit Shoulders & Extraction Epaulettes
      ctx.fillStyle = livery.primary;
      ctx.fillRect(shift * 0.58 - 6.5, -26, 13, 4.5);
      ctx.fillStyle = livery.accent;
      ctx.fillRect(shift * 0.58 - 6.5, -26.5, 3.2, 1.5);
      ctx.fillRect(shift * 0.58 + 3.3, -26.5, 3.2, 1.5);
      ctx.fillStyle = livery.helmet;
      ctx.beginPath();
      ctx.arc(shift * 0.6, -28.5, 5.5, 0, Math.PI * 2);
      ctx.fill();
      if (driverGenderRef.current === 'FEMALE') {
        ctx.fillStyle = livery.hairColor || '#451a03';
        ctx.beginPath();
        ctx.ellipse(shift * 0.6, -23.5, 2.4, 3.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = livery.accent;
        ctx.fillRect(shift * 0.6 - 1.6, -26.2, 3.2, 1.3);
      }
      ctx.fillStyle = livery.visor;
      ctx.fillRect(shift * 0.6 - 4, -30.5, 8, 2.5);
      ctx.fillStyle = livery.halo;
      ctx.strokeStyle = livery.halo;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(shift * 0.58, -27, 7.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();

      // Rear suspension arms
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-12, -10);
      ctx.lineTo(-34 + shift * 0.15, -12);
      ctx.moveTo(12, -10);
      ctx.lineTo(34 + shift * 0.15, -12);
      ctx.stroke();

      // Wide rear F1 slick tires (closest to camera, prominent like 30498.jpg)
      const rearWheelOffset = 34;
      drawTire3D(-rearWheelOffset + shift * 0.15, 0, 18, 25, true);
      drawTire3D(rearWheelOffset + shift * 0.15, 0, 18, 25, true);

      // Rear diffuser & gearbox housing + FIA rain/brake light
      ctx.fillStyle = '#090d16';
      ctx.fillRect(shift * 0.1 - 15, -11, 30, 9);
      ctx.fillStyle = '#334155';
      ctx.fillRect(shift * 0.1 - 13, -9, 2, 7);
      ctx.fillRect(shift * 0.1 - 6, -9, 2, 7);
      ctx.fillRect(shift * 0.1 + 4, -9, 2, 7);
      ctx.fillRect(shift * 0.1 + 11, -9, 2, 7);

      // Exhaust pipe & central rain light
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.arc(shift * 0.12, -14, 2.6, 0, Math.PI * 2);
