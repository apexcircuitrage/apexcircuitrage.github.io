function generateCircuit(level) {
  const safeLevel = Math.max(1, Math.min(30, level || 1));
  const seed = safeLevel * 1013904223 + 1664525 >>> 0;
  const rng = createRng(seed);
  const mapCfg = LEVEL_MAPS[safeLevel - 1];
  const name = mapCfg.name;
  const biome = mapCfg;
  const archetype = {
    id: `level_${safeLevel}`,
    name: mapCfg.layoutName,
    difficultyLabel: mapCfg.difficultyLabel,
    diffStars: mapCfg.diffStars,
    laps: mapCfg.laps
  };
  const nodeCount = 32;
  // Track size grows with level while trackWidth gets progressively narrower from 236px (Lv 1) down to 162px (Lv 30)
  const levelRatio = (safeLevel - 1) / 29;
  const baseRadiusX = (1250 + safeLevel * 32) * mapCfg.aspectX;
  const baseRadiusY = (1100 + safeLevel * 28) * mapCfg.aspectY;
  const trackWidth = Math.round(236 - levelRatio * 74);
  const curbWidth = 26;
  const rotation = (safeLevel - 1) * 0.47;
  const cosR = Math.cos(rotation);
  const sinR = Math.sin(rotation);
  const rawRadii = [];
  const angleStep = Math.PI * 2 / nodeCount;
  const jitterAmp = 0.02 + levelRatio * 0.04;
  for (let i = 0; i < nodeCount; i++) {
    const a = i * angleStep;
    const baseR = mapCfg.shapeFn(a);
    const r = clamp(baseR + (rng() - 0.5) * jitterAmp, 0.48, 1.48);
    rawRadii.push(r);
  }
  // Smooth radii so high-frequency chicanes are crisp yet never self-intersect
  const smoothedRadii = rawRadii.map((r, i) => {
    const prev = rawRadii[(i - 1 + nodeCount) % nodeCount];
    const next = rawRadii[(i + 1) % nodeCount];
    return prev * 0.23 + r * 0.54 + next * 0.23;
  });
  const waypoints = [];
  for (let i = 0; i < nodeCount; i++) {
    const angle = i * angleStep;
    const rFactor = smoothedRadii[i];
    const lx = Math.cos(angle) * baseRadiusX * rFactor;
    const ly = Math.sin(angle) * baseRadiusY * rFactor;
    waypoints.push({
      x: lx * cosR - ly * sinR,
      y: lx * sinR + ly * cosR
    });
  }
  let sumX = 0;
  let sumY = 0;
  for (const wp of waypoints) {
    sumX += wp.x;
    sumY += wp.y;
  }
  const avgX = sumX / nodeCount;
  const avgY = sumY / nodeCount;
  for (const wp of waypoints) {
    wp.x -= avgX;
    wp.y -= avgY;
  }
  const rawPoints = [];
  const stepsPerSegment = 24;
  for (let i = 0; i < nodeCount; i++) {
    const p0 = waypoints[(i - 1 + nodeCount) % nodeCount];
    const p1 = waypoints[i];
    const p2 = waypoints[(i + 1) % nodeCount];
    const p3 = waypoints[(i + 2) % nodeCount];
    for (let s = 0; s < stepsPerSegment; s++) {
      const t = s / stepsPerSegment;
      rawPoints.push(catmullRom(p0, p1, p2, p3, t));
    }
  }
  const samples = [];
  let cumDist = 0;
  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;
  for (let i = 0; i < rawPoints.length; i++) {
    const curr = rawPoints[i];
    const next = rawPoints[(i + 1) % rawPoints.length];
    const prev = rawPoints[(i - 1 + rawPoints.length) % rawPoints.length];
    const dx = next.x - prev.x;
    const dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    const tx = dx / len;
    const ty = dy / len;
    const nx = -ty;
    const ny = tx;
    const segDx1 = curr.x - prev.x;
    const segDy1 = curr.y - prev.y;
    const segDx2 = next.x - curr.x;
    const segDy2 = next.y - curr.y;
    const a1 = Math.atan2(segDy1, segDx1);
    const a2 = Math.atan2(segDy2, segDx2);
    const curvature = Math.abs(normalizeAngle(a2 - a1));
    samples.push({
      x: curr.x,
      y: curr.y,
      tx,
      ty,
      nx,
      ny,
      dist: cumDist,
      curvature
    });
    const stepDist = Math.hypot(next.x - curr.x, next.y - curr.y);
    cumDist += stepDist;
    minX = Math.min(minX, curr.x);
    maxX = Math.max(maxX, curr.x);

function queryTrackPosition(track, x, y, lastKnownIdx = 0) {
  const {
    samples,
    trackWidth,
    curbWidth

  let minDistSq = Infinity;
  for (let offset = -searchRadius; offset <= searchRadius; offset++) {
    const idx = (lastKnownIdx + offset + numSamples) % numSamples;
    const pt = samples[idx];
    const dx = x - pt.x;
    const dy = y - pt.y;
    const dSq = dx * dx + dy * dy;
    if (dSq < minDistSq) {

      bestIdx = idx;
    }
  }
  if (minDistSq > 60000) {
    for (let i = 0; i < numSamples; i += 4) {
      const pt = samples[i];
      const dx = x - pt.x;
      const dy = y - pt.y;
      const dSq = dx * dx + dy * dy;
      if (dSq < minDistSq) {
        minDistSq = dSq;
        bestIdx = i;
      }
    }
  }
  const bestPt = samples[bestIdx];
  const toCarX = x - bestPt.x;
  const toCarY = y - bestPt.y;

  } else {
    surface = 'offroad';
  }
  const tangentAngle = Math.atan2(bestPt.ty, bestPt.tx);

    closestIdx: bestIdx,
    distToCenterline,
    lateralOffset,
    progressDist: bestPt.dist,
    tangentAngle,
    surface

}

            color: isDarkB ? 0x334155 : 0x64748b,
            roughness: 0.85,
            flatShading: true
          });
          const peakSnowMat = new THREE.MeshStandardMaterial({
            color: isDarkB ? 0x38bdf8 : 0xf8fafc,
            roughness: 0.5,
            flatShading: true
          });
          for (let m = 0; m < 44; m++) {
            const ang = (m / 44) * Math.PI * 2;
            const dist = 3600 + (m % 4) * 310;
            const h = 380 + ((m * 89) % 360);
            const r = 340 + ((m * 53) % 210);
            const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), m % 2 === 0 ? rockMat : ridgeMat);
            cone.position.set(Math.cos(ang) * dist, h * 0.48 - 12, Math.sin(ang) * dist);
            cone.rotation.y = m * 0.7;
            mtnGroup.add(cone);
            if (h > 480) {
              const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.39, h * 0.36, 7), peakSnowMat);
              cap.position.set(Math.cos(ang) * dist, h * 0.81 - 12, Math.sin(ang) * dist);
              cap.rotation.y = m * 0.7;
              mtnGroup.add(cap);
            }
          }
          scene.add(mtnGroup);

          // 5. High-Contrast Deep Racing Asphalt Texture (No washed-out white tint!)
          const aspCan = document.createElement('canvas');
          aspCan.width = 256;
          aspCan.height = 256;
          const aCtx = aspCan.getContext('2d');
          aCtx.fillStyle = '#141923';
          aCtx.fillRect(0, 0, 256, 256);
          for (let i = 0; i < 4200; i++) {
            const ax = (i * 97 + (i >> 3) * 31) & 255;
            const ay = (i * 53 + (i >> 2) * 19) & 255;
            const v = (i % 3 === 0) ? 28 : (i % 3 === 1 ? 16 : 36);
            aCtx.fillStyle = `rgb(${v},${v + 3},${v + 8})`;
            aCtx.globalAlpha = 0.35;
            aCtx.fillRect(ax, ay, 2, 2);
          }
          // Subtle longitudinal tire wear grooves
          aCtx.fillStyle = '#090d16';
          aCtx.globalAlpha = 0.32;
          aCtx.fillRect(48, 0, 36, 256);
          aCtx.fillRect(172, 0, 36, 256);
          // Crisp dashed center racing line baked into asphalt UV
          aCtx.fillStyle = '#f8fafc';
          aCtx.globalAlpha = 0.55;
          aCtx.fillRect(124, 0, 8, 128);
          aCtx.globalAlpha = 1.0;
          const aspTex = new THREE.CanvasTexture(aspCan);
          aspTex.wrapS = THREE.RepeatWrapping;
          aspTex.wrapT = THREE.RepeatWrapping;
          aspTex.anisotropy = 4;

          // Helper to build UV-mapped 3D Ribbon Geometry with Z-fighting protection
          const addRibbonMesh = (offsetA, offsetB, yHeight, colorHexA, colorHexB, stripePeriod, opts = {}) => {
            const positions = [];
            const colors = [];
            const uvs = [];
            const cA = new THREE.Color(colorHexA);
            const cB = new THREE.Color(colorHexB || colorHexA);
            const extrudeY = opts.extrudeY || 0;
            for (let i = 0; i < totalSamples; i++) {
              const p1 = samples[i];
              const p2 = samples[(i + 1) % totalSamples];
              const useA = stripePeriod ? (Math.floor(i / stripePeriod) % 2 === 0) : true;
              const col = useA ? cA : cB;

              const x1a = p1.x + p1.nx * offsetA, z1a = p1.y + p1.ny * offsetA;
              const x1b = p1.x + p1.nx * offsetB, z1b = p1.y + p1.ny * offsetB;
              const x2a = p2.x + p2.nx * offsetA, z2a = p2.y + p2.ny * offsetA;
              const x2b = p2.x + p2.nx * offsetB, z2b = p2.y + p2.ny * offsetB;

              const v1 = i * 0.25;
              const v2 = (i + 1) * 0.25;

              // Top face
              positions.push(
                x1a, yHeight, z1a,
                x1b, yHeight, z1b,
                x2b, yHeight, z2b,
                x1a, yHeight, z1a,
                x2b, yHeight, z2b,
                x2a, yHeight, z2a
              );
              uvs.push(0, v1, 1, v1, 1, v2, 0, v1, 1, v2, 0, v2);
              for (let k = 0; k < 6; k++) colors.push(col.r, col.g, col.b);

              // Optional 3D beveled side wall (for raised curbs & guardrails)
              if (extrudeY > 0) {
                const sideCol = col.clone().multiplyScalar(0.8);
                positions.push(
                  x1a, -1.5, z1a,
                  x1a, yHeight, z1a,
                  x2a, yHeight, z2a,
                  x1a, -1.5, z1a,
                  x2a, yHeight, z2a,
                  x2a, -1.5, z2a,
                  x1b, yHeight, z1b,
                  x1b, -1.5, z1b,
                  x2b, -1.5, z2b,
                  x1b, yHeight, z1b,
                  x2b, -1.5, z2b,
                  x2b, yHeight, z2b
                );
                for (let k = 0; k < 12; k++) {
                  uvs.push(0, 0);
                  colors.push(sideCol.r, sideCol.g, sideCol.b);
                }
              }
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geo.computeVertexNormals();
            const mat = new THREE.MeshLambertMaterial({
              vertexColors: true,
              map: opts.map || null,
              side: THREE.DoubleSide,
              polygonOffset: Boolean(opts.polyOffset),
              polygonOffsetFactor: opts.polyOffset || 0,
              polygonOffsetUnits: opts.polyOffset || 0
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.receiveShadow = true;
            if (opts.castShadow) mesh.castShadow = true;
            scene.add(mesh);
          };

          // Gravel traps along track shoulders (non-overlapping lateral band)
          addRibbonMesh(-(halfRoad + curbW + gravelWidth), -(halfRoad + curbW), 0.2, biome.gravel, biome.gravelSpecA, 0, { polyOffset: -1 });
          addRibbonMesh(halfRoad + curbW, halfRoad + curbW + gravelWidth, 0.2, biome.gravel, biome.gravelSpecA, 0, { polyOffset: -1 });

          // 3D Raised Sawtooth Red/White Rumble Curbs (vibrant saturated colors)
          addRibbonMesh(-(halfRoad + curbW), -halfRoad, 1.85, biome.curbA, biome.curbB, 3, { extrudeY: 1.85, polyOffset: -2 });
          addRibbonMesh(halfRoad, halfRoad + curbW, 1.85, biome.curbA, biome.curbB, 3, { extrudeY: 1.85, polyOffset: -2 });

          // Main Deep Racing Asphalt Tarmac Road (uniform vertex color, no stripe flashing)
          addRibbonMesh(-halfRoad, halfRoad, 0.65, '#ffffff', '#ffffff', 0, {
            map: aspTex,
            polyOffset: -1
          });

          // Crisp White Painted Track Edge Lines (well above tarmac + polygonOffset so zero Z-fighting)
          addRibbonMesh(-halfRoad, -(halfRoad - 3.6), 1.15, '#ffffff', '#ffffff', 0, { polyOffset: -3 });
          addRibbonMesh(halfRoad - 3.6, halfRoad, 1.15, '#ffffff', '#ffffff', 0, { polyOffset: -3 });

          // Continuous 3D Steel Armco Guardrails outside the gravel runoff
          const guardDist = halfRoad + curbW + gravelWidth + 14;
          addRibbonMesh(-(guardDist + 2.5), -guardDist, 9.5, '#94a3b8', '#cbd5e1', 2, {
            extrudeY: 9.4,
            roughness: 0.32,
            metalness: 0.72
          });
          addRibbonMesh(guardDist, guardDist + 2.5, 9.5, '#94a3b8', '#cbd5e1', 2, {
            extrudeY: 9.4,
            roughness: 0.32,
            metalness: 0.72
          });

          // Checkered Start / Finish Line
          const sfPos = [];
          const sfCol = [];
          for (let idx = 0; idx <= 1; idx++) {
            const p1 = samples[idx];
            const p2 = samples[(idx + 1) % totalSamples];
            const checkSlices = 12;
            for (let c = 0; c < checkSlices; c++) {
              const tA = -halfRoad + (c / checkSlices) * track.trackWidth;
              const tB = -halfRoad + ((c + 1) / checkSlices) * track.trackWidth;
              const col = (idx + c) % 2 === 0 ? new THREE.Color(0x090d16) : new THREE.Color(0xffffff);
              const x1a = p1.x + p1.nx * tA, z1a = p1.y + p1.ny * tA;
              const x1b = p1.x + p1.nx * tB, z1b = p1.y + p1.ny * tB;
              const x2a = p2.x + p2.nx * tA, z2a = p2.y + p2.ny * tA;
              const x2b = p2.x + p2.nx * tB, z2b = p2.y + p2.ny * tB;
              sfPos.push(x1a, 1.35, z1a, x1b, 1.35, z1b, x2b, 1.35, z2b, x1a, 1.35, z1a, x2b, 1.35, z2b, x2a, 1.35, z2a);
              for (let k = 0; k < 6; k++) sfCol.push(col.r, col.g, col.b);
            }
          }
          const sfGeo = new THREE.BufferGeometry();
          sfGeo.setAttribute('position', new THREE.Float32BufferAttribute(sfPos, 3));
          sfGeo.setAttribute('color', new THREE.Float32BufferAttribute(sfCol, 3));
          sfGeo.computeVertexNormals();
          scene.add(new THREE.Mesh(sfGeo, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 })));

          // 6. Detailed 3D Start/Finish Gantry Arch with 5 Interactive FIA Start Lights + Grandstand Tribunes
          const s0 = samples[0];
          const gantryGroup = new THREE.Group();
          gantryGroup.position.set(s0.x, 0, s0.y);
          const roadAngle = Math.atan2(s0.ty, s0.tx);
          gantryGroup.rotation.y = -roadAngle;
          const trussMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.75, roughness: 0.28 });
          const bannerMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.35, metalness: 0.2 });
          const spanW = (halfRoad + curbW + 14) * 2;
          const pLeft = new THREE.Mesh(new THREE.BoxGeometry(9, 84, 9), trussMat);
          pLeft.position.set(0, 42, -spanW * 0.5);
          pLeft.castShadow = true;
          const pRight = new THREE.Mesh(new THREE.BoxGeometry(9, 84, 9), trussMat);
          pRight.position.set(0, 42, spanW * 0.5);
          pRight.castShadow = true;
          const topBeam = new THREE.Mesh(new THREE.BoxGeometry(14, 18, spanW + 18), bannerMat);
          topBeam.position.set(0, 78, 0);
          topBeam.castShadow = true;
          gantryGroup.add(pLeft, pRight, topBeam);

          // 5 FIA Starting Light Pods under the Gantry
          st.gantryLights = [];
          for (let li = 0; li < 5; li++) {
            const podZ = (li - 2) * 18;
            const podBox = new THREE.Mesh(new THREE.BoxGeometry(6, 12, 10), trussMat);
            podBox.position.set(-6, 64, podZ);
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0x3f0a0a });
            const bulb = new THREE.Mesh(new THREE.SphereGeometry(3.2, 10, 10), bulbMat);
            bulb.position.set(-9.2, 64, podZ);
            gantryGroup.add(podBox, bulb);
            st.gantryLights.push(bulbMat);
          }
          scene.add(gantryGroup);

          // Grandstand Stadium Tribunes along the main straight & key corners
          const grandIndices = [6, Math.floor(totalSamples * 0.33), Math.floor(totalSamples * 0.66)];
          for (const gIdx of grandIndices) {
            const gp = samples[gIdx % totalSamples];
            if (!gp) continue;
            const trib = new THREE.Group();
            const sideSign = gIdx === 6 ? -1 : 1;
            const distOut = halfRoad + curbW + gravelWidth + 95;
            trib.position.set(gp.x + gp.nx * sideSign * distOut, 0, gp.y + gp.ny * sideSign * distOut);
            trib.rotation.y = -Math.atan2(gp.ty, gp.tx) + (sideSign > 0 ? Math.PI : 0);

            const baseConcrete = new THREE.Mesh(
              new THREE.BoxGeometry(220, 38, 52),
              new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 })
            );
            baseConcrete.position.set(0, 19, 0);
            baseConcrete.castShadow = true;
            trib.add(baseConcrete);

            // Tiered colorful spectator seating rows
            const seatColors = [0xef4444, 0xfacc15, 0x38bdf8, 0xf8fafc];
            for (let tier = 0; tier < 4; tier++) {
              const rowMesh = new THREE.Mesh(
                new THREE.BoxGeometry(212, 6, 10),
                new THREE.MeshStandardMaterial({ color: seatColors[tier % seatColors.length], roughness: 0.5 })
              );
              rowMesh.position.set(0, 14 + tier * 7.5, -18 + tier * 10);
              trib.add(rowMesh);
            }

            // Cantilevered Stadium Roof
            const roof = new THREE.Mesh(
              new THREE.BoxGeometry(228, 4, 68),
              new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.3, roughness: 0.35 })
            );
            roof.position.set(0, 56, -4);
            roof.rotation.x = 0.12;
            roof.castShadow = true;
            trib.add(roof);

            scene.add(trib);
          }

          // 7. Realistic 3D Trackside Props (Multi-sphere Trees, Tire Stacks, Brake Marker Boards, Neon Pylons)
          if (track.decorations) {
            const trunkGeo = new THREE.CylinderGeometry(3.2, 5.2, 26, 8);
            const foliageSphere = new THREE.DodecahedronGeometry(18, 1);
            const tireTorus = new THREE.TorusGeometry(6.5, 3.2, 8, 14);
            tireTorus.rotateX(Math.PI / 2);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2511, roughness: 0.9 });
            const tireRedMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.6 });
            const tireDarkMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });

            for (const dec of track.decorations) {
              if (dec.type === 'tire_barrier') {
                const stackGrp = new THREE.Group();
                stackGrp.position.set(dec.x, 0, dec.y);
                const mat = (dec.variant || 0) % 2 === 0 ? tireRedMat : tireDarkMat;
                for (let layer = 0; layer < 3; layer++) {
                  const tMesh = new THREE.Mesh(tireTorus, mat);
                  tMesh.position.y = 3.2 + layer * 5.8;
                  tMesh.castShadow = true;
                  stackGrp.add(tMesh);
                }
                scene.add(stackGrp);
              } else if (dec.type === 'chevron') {
                const signGrp = new THREE.Group();
                signGrp.position.set(dec.x, 0, dec.y);
                signGrp.rotation.y = -(dec.angle || 0);
                const board = new THREE.Mesh(
                  new THREE.BoxGeometry(4, 20, 36),
                  new THREE.MeshStandardMaterial({ color: 0xdc2626, emissive: 0x450a0a, roughness: 0.4 })
                );
                board.position.y = 16;
                board.castShadow = true;
                signGrp.add(board);
                scene.add(signGrp);
              } else if (dec.type === 'neon_pylon') {
                const nCol = (dec.variant || 0) % 2 === 0 ? 0x22d3ee : 0xec4899;
                const pMat = new THREE.MeshStandardMaterial({ color: nCol, emissive: nCol, emissiveIntensity: 0.85, roughness: 0.2 });
                const pylon = new THREE.Mesh(new THREE.CylinderGeometry(5, 7, 68, 8), pMat);
                pylon.position.set(dec.x, 34, dec.y);
                scene.add(pylon);
              } else {
                const treeGrp = new THREE.Group();
                treeGrp.position.set(dec.x, 0, dec.y);
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 13;
                trunk.castShadow = true;
                const cColor = dec.type === 'autumn_tree' ? 0xea580c : dec.type === 'sakura_tree' ? 0xec4899 : dec.type === 'snow_pine' ? 0x0f766e : 0x15803d;
                const leafMat = new THREE.MeshStandardMaterial({ color: cColor, roughness: 0.78, flatShading: true });
                const cMain = new THREE.Mesh(foliageSphere, leafMat);
                cMain.position.set(0, 38, 0);
                cMain.scale.set(1.25, 1.45, 1.25);
                cMain.castShadow = true;
                const cSub1 = new THREE.Mesh(foliageSphere, leafMat);
                cSub1.position.set(-10, 30, 8);
                cSub1.scale.set(0.85, 0.9, 0.85);
                const cSub2 = new THREE.Mesh(foliageSphere, leafMat);
                cSub2.position.set(11, 32, -7);
                cSub2.scale.set(0.8, 0.85, 0.8);
                treeGrp.add(trunk, cMain, cSub1, cSub2);
                scene.add(treeGrp);
              }
            }
          }

          // 8. Build Hyper-Realistic Sculpted 3D Formula 1 Cars with PBR Clearcoat Paint, Wishbone Suspension, Glowing Brake Rotors & Exhaust Afterburners
          const createF1CarMesh = carId => {
            const liv = LIVERIES[carId] || LIVERIES.player;
            const grp = new THREE.Group();

            // Ultra-Vibrant Glossy Racing Livery Materials (high color saturation + emissive punch)
            const MatClass = THREE.MeshPhysicalMaterial || THREE.MeshStandardMaterial;
            const bodyMat = new MatClass({
              color: liv.primary,
              emissive: liv.primary,
              emissiveIntensity: 0.22,
              metalness: 0.22,
              roughness: 0.16,
              clearcoat: 1.0,
              clearcoatRoughness: 0.06
            });
            const darkMat = new MatClass({
              color: liv.primaryDark,
              emissive: liv.primaryDark,
              emissiveIntensity: 0.18,
              metalness: 0.25,
              roughness: 0.22,
              clearcoat: 0.85
            });
            const accentMat = new MatClass({
              color: liv.accent,
              emissive: liv.accent,
              emissiveIntensity: 0.20,
              metalness: 0.15,
              roughness: 0.18,
              clearcoat: 0.9
            });
            const carbonMat = new THREE.MeshStandardMaterial({
              color: 0x111827,
              metalness: 0.35,
              roughness: 0.42
            });
            const suspensionMat = new THREE.MeshStandardMaterial({
              color: 0x1e293b,
              metalness: 0.8,
              roughness: 0.25
            });
            const tireRubberMat = new THREE.MeshStandardMaterial({
              color: 0x14171f,
              roughness: 0.78,
              metalness: 0.08
            });
            const alloyRimMat = new THREE.MeshStandardMaterial({
              color: 0x94a3b8,
              metalness: 0.88,
              roughness: 0.2
            });
            const compoundRingMat = new THREE.MeshBasicMaterial({ color: liv.tireCompound });

            // Soft Ground Contact Shadow Blob under the car
            const shCan = document.createElement('canvas');
            shCan.width = 64;
            shCan.height = 64;
            const shCtx = shCan.getContext('2d');
            const shGrad = shCtx.createRadialGradient(32, 32, 4, 32, 32, 30);
            shGrad.addColorStop(0, 'rgba(0,0,0,0.85)');
            shGrad.addColorStop(0.65, 'rgba(0,0,0,0.45)');
            shGrad.addColorStop(1, 'rgba(0,0,0,0)');
            shCtx.fillStyle = shGrad;
            shCtx.fillRect(0, 0, 64, 64);
            const shadowPlane = new THREE.Mesh(
              new THREE.PlaneGeometry(76, 40),
              new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shCan), transparent: true, depthWrite: false })
            );
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.position.set(0, 0.78, 0);
            grp.add(shadowPlane);

            // Venturi Carbon Floor & Rear Diffuser Tunnels
            const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(60, 1.6, 29), carbonMat);
            floorMesh.position.set(-1, 2.6, 0);
            floorMesh.castShadow = true;
            grp.add(floorMesh);

            const diffuser = new THREE.Mesh(new THREE.BoxGeometry(10, 4.2, 24), carbonMat);
            diffuser.position.set(-28, 4.2, 0);
            diffuser.rotation.z = -0.18;
            grp.add(diffuser);

            // Sculpted Monocoque Tub & Tapered Aerodynamic Nose Cone (+X is forward)
            const monocoque = new THREE.Mesh(new THREE.BoxGeometry(36, 7.2, 10.5), bodyMat);
            monocoque.position.set(0, 7.2, 0);
            monocoque.castShadow = true;
            grp.add(monocoque);

            const noseMid = new THREE.Mesh(new THREE.BoxGeometry(16, 5.2, 7.6), bodyMat);
            noseMid.position.set(22, 5.8, 0);
            noseMid.rotation.z = -0.09;
            noseMid.castShadow = true;
            grp.add(noseMid);

            const noseTip = new THREE.Mesh(new THREE.BoxGeometry(12, 3.2, 4.8), accentMat);
            noseTip.position.set(32, 4.1, 0);
            noseTip.rotation.z = -0.14;
            grp.add(noseTip);

            // Contoured Sidepods with Undercut & Radiator Intakes
            for (const side of [-1, 1]) {
              const spBody = new THREE.Mesh(new THREE.BoxGeometry(28, 6.4, 9.2), darkMat);
              spBody.position.set(-3, 6.4, side * 9.2);
              spBody.rotation.y = side * -0.06;
              spBody.castShadow = true;
              grp.add(spBody);

              const spTop = new THREE.Mesh(new THREE.BoxGeometry(26, 1.8, 8.4), bodyMat);
              spTop.position.set(-3, 9.6, side * 8.8);
              grp.add(spTop);

              const spStripe = new THREE.Mesh(new THREE.BoxGeometry(28.5, 1.4, 9.6), accentMat);
              spStripe.position.set(-3, 7.0, side * 9.2);
              grp.add(spStripe);

              const intake = new THREE.Mesh(
                new THREE.BoxGeometry(2.5, 4.8, 6.8),
                new THREE.MeshBasicMaterial({ color: 0x020617 })
              );
              intake.position.set(10.5, 6.8, side * 9.2);
              grp.add(intake);
            }

            // Engine Cover, Roll Hoop Airbox, T-Cam Pod & Shark Fin
            const engineCover = new THREE.Mesh(new THREE.BoxGeometry(26, 6.8, 6.8), bodyMat);
            engineCover.position.set(-11, 12.2, 0);
            engineCover.rotation.z = 0.14;
            engineCover.castShadow = true;
            grp.add(engineCover);

            const rollHoop = new THREE.Mesh(new THREE.BoxGeometry(8, 5.5, 5.2), bodyMat);

            // FIA Fluorescent Yellow T-Cam on top of Roll Hoop

            tCamStem.position.set(-3, 18.2, 0);
            const tCamWing = new THREE.Mesh(

            tCamWing.position.set(-3, 19.6, 0);
            grp.add(tCamStem, tCamWing);

            const sharkFin = new THREE.Mesh(new THREE.BoxGeometry(19, 7.5, 1.1), accentMat);
            sharkFin.position.set(-17, 14.8, 0);
            grp.add(sharkFin);

            // Cockpit Recess, Driver Helmet + Reflective Metallic Visor + Titanium Halo
            const cockpitHole = new THREE.Mesh(
              new THREE.BoxGeometry(13, 3.2, 7.8),
              new THREE.MeshBasicMaterial({ color: 0x020617 })
            );
            cockpitHole.position.set(3.5, 10.2, 0);
            grp.add(cockpitHole);

            const helmet = new THREE.Mesh(
              new THREE.SphereGeometry(3.5, 14, 14),
              new MatClass({ color: liv.helmet, metalness: 0.4, roughness: 0.15, clearcoat: 1.0 })
            );
            helmet.position.set(2.5, 12.6, 0);
            grp.add(helmet);

            const visor = new THREE.Mesh(
              new THREE.CylinderGeometry(3.62, 3.62, 1.9, 12, 1, false, -Math.PI * 0.35, Math.PI * 0.7),
              new THREE.MeshStandardMaterial({ color: liv.visor, metalness: 0.95, roughness: 0.05 })
            );
            visor.rotation.y = Math.PI * 0.5;
            visor.position.set(2.7, 12.8, 0);
            grp.add(visor);

            const haloMain = new THREE.Mesh(new THREE.TorusGeometry(5.2, 0.72, 8, 16, Math.PI), carbonMat);
            haloMain.rotation.x = Math.PI / 2;
            haloMain.rotation.z = -Math.PI / 2;
            haloMain.position.set(3.2, 13.4, 0);
            const haloPillar = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 4.6, 8), carbonMat);
            haloPillar.position.set(8.2, 11.8, 0);
            haloPillar.rotation.z = -0.35;
            grp.add(haloMain, haloPillar);

            // Multi-Element Front Wing + Curved Endplates
            const fwMain = new THREE.Mesh(new THREE.BoxGeometry(6.5, 1.2, 34), carbonMat);
            fwMain.position.set(33, 2.6, 0);
            const fwFlap = new THREE.Mesh(new THREE.BoxGeometry(4.8, 1.1, 33.4), accentMat);
            fwFlap.position.set(31.5, 3.6, 0);
            fwFlap.rotation.z = 0.15;
            const fwEndL = new THREE.Mesh(new THREE.BoxGeometry(9.5, 5.5, 1.2), bodyMat);
            fwEndL.position.set(32.5, 4.4, -17);
            const fwEndR = new THREE.Mesh(new THREE.BoxGeometry(9.5, 5.5, 1.2), bodyMat);
            fwEndR.position.set(32.5, 4.4, 17);
            grp.add(fwMain, fwFlap, fwEndL, fwEndR);

            // Swan-Neck DRS Rear Wing + Beam Wing + Sculpted Endplates
            const rwPylon = new THREE.Mesh(new THREE.BoxGeometry(5.5, 9.5, 1.4), carbonMat);
            rwPylon.position.set(-26, 12.5, 0);
            const rwMain = new THREE.Mesh(new THREE.BoxGeometry(6.8, 1.8, 28), bodyMat);
            rwMain.position.set(-28.5, 16.5, 0);
            rwMain.castShadow = true;
            const rwFlap = new THREE.Mesh(new THREE.BoxGeometry(4.8, 1.6, 27.6), accentMat);
            rwFlap.position.set(-29.8, 18.4, 0);
            rwFlap.rotation.z = 0.22;
            const epL = new THREE.Mesh(new THREE.BoxGeometry(10.5, 13.5, 1.3), darkMat);
            epL.position.set(-28.5, 13.5, -14.2);
            const epR = new THREE.Mesh(new THREE.BoxGeometry(10.5, 13.5, 1.3), darkMat);
            epR.position.set(-28.5, 13.5, 14.2);
            grp.add(rwPylon, rwMain, rwFlap, epL, epR);

            // Double-Wishbone Suspension Arms (Front & Rear)
            const addWishbones = (wx, wz, chassisX) => {
              const len = Math.hypot(wx - chassisX, wz);
              const armUpper = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, len, 6), suspensionMat);
              armUpper.position.set((wx + chassisX) * 0.5, 7.2, wz * 0.55);
              armUpper.rotation.x = Math.PI / 2;
              armUpper.rotation.z = Math.atan2(wx - chassisX, wz);
              const armLower = armUpper.clone();
              armLower.position.y = 4.4;
              grp.add(armUpper, armLower);
            };
            addWishbones(20, -15.5, 16);
            addWishbones(20, 15.5, 16);
            addWishbones(-20, -16.5, -16);
            addWishbones(-20, 16.5, -16);

            // Central Exhaust Pipe + Glowing Afterburner Flame Cone + FIA Rain/Brake Light
            const exhaustPipe = new THREE.Mesh(
              new THREE.CylinderGeometry(1.5, 1.7, 5, 10),
              alloyRimMat
            );
            exhaustPipe.rotation.z = Math.PI / 2;
            exhaustPipe.position.set(-29.5, 9.2, 0);
            grp.add(exhaustPipe);

            const flameMat = new THREE.MeshBasicMaterial({
              color: 0x38bdf8,
              transparent: true,
              opacity: 0.0
            });
            const exhaustFlame = new THREE.Mesh(new THREE.ConeGeometry(2.2, 11, 10), flameMat);
            exhaustFlame.rotation.z = Math.PI / 2;
            exhaustFlame.position.set(-35.5, 9.2, 0);
            grp.add(exhaustFlame);

            const brakeLightMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });
            const brakeLight = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.6, 2.8), brakeLightMat);
            brakeLight.position.set(-30.5, 6.2, 0);
            grp.add(brakeLight);

            // 4 Pirelli-style 3D Slick Wheels with Rounded Shoulders, Spokes, Compound Rings & Glowing Brake Discs
            const wheelPositions = [
              { x: 20, z: -15.8, r: 6.4, w: 6.8, isFront: true },
              { x: 20, z: 15.8, r: 6.4, w: 6.8, isFront: true },
              { x: -20, z: -16.8, r: 7.6, w: 9.2, isFront: false },
              { x: -20, z: 16.8, r: 7.6, w: 9.2, isFront: false }
            ];
            const wheels = [];
            const brakeDiscMats = [];
            for (const wp of wheelPositions) {
              const steerHub = new THREE.Group();
              steerHub.position.set(wp.x, wp.r, wp.z);

              // Brake Rotor Disc (glows orange-red under heavy braking)
              const discMat = new THREE.MeshStandardMaterial({
                color: 0x475569,
                emissive: 0x000000,
                metalness: 0.8,
                roughness: 0.3
              });
              brakeDiscMats.push(discMat);
              const brakeDisc = new THREE.Mesh(
                new THREE.CylinderGeometry(wp.r * 0.58, wp.r * 0.58, 1.4, 12),
                discMat
              );
              brakeDisc.rotation.x = Math.PI / 2;
              brakeDisc.position.z = wp.z > 0 ? -1.5 : 1.5;
              steerHub.add(brakeDisc);

              const spinGrp = new THREE.Group();
              const tireCyl = new THREE.Mesh(new THREE.CylinderGeometry(wp.r, wp.r, wp.w, 20), tireRubberMat);
              tireCyl.rotation.x = Math.PI / 2;
              tireCyl.castShadow = true;
              spinGrp.add(tireCyl);

              // Rounded tire shoulders
              for (const sSide of [-1, 1]) {
                const shoulder = new THREE.Mesh(
                  new THREE.TorusGeometry(wp.r * 0.82, wp.r * 0.18, 10, 20),
                  tireRubberMat
                );
                shoulder.position.z = sSide * (wp.w * 0.42);
                spinGrp.add(shoulder);

                // Colored Pirelli sidewall stripe
                const stripe = new THREE.Mesh(
                  new THREE.RingGeometry(wp.r * 0.62, wp.r * 0.74, 20),
                  compoundRingMat
                );
                stripe.position.z = sSide * (wp.w * 0.505);
                if (sSide < 0) stripe.rotation.y = Math.PI;
                spinGrp.add(stripe);
              }

              // Metallic Wheel Rim + Spokes + Central Wheel Nut
              const rim = new THREE.Mesh(new THREE.CylinderGeometry(wp.r * 0.56, wp.r * 0.56, wp.w + 0.2, 14), alloyRimMat);
              rim.rotation.x = Math.PI / 2;
              const spokeBar1 = new THREE.Mesh(new THREE.BoxGeometry(wp.r * 1.02, 1.1, wp.w + 0.4), carbonMat);
              const spokeBar2 = new THREE.Mesh(new THREE.BoxGeometry(1.1, wp.r * 1.02, wp.w + 0.4), carbonMat);
              const nut = new THREE.Mesh(
                new THREE.CylinderGeometry(1.3, 1.3, wp.w + 0.7, 8),
                new THREE.MeshBasicMaterial({ color: 0xef4444 })
              );
              nut.rotation.x = Math.PI / 2;
              spinGrp.add(rim, spokeBar1, spokeBar2, nut);

              steerHub.add(spinGrp);
              grp.add(steerHub);
              wheels.push({ steerHub, spinGrp, isFront: wp.isFront });
            }

            grp.userData = { wheels, brakeLightMat, brakeDiscMats, exhaustFlame, flameMat };
            scene.add(grp);
            return grp;
          };

          st.carMeshes = {
            player: createF1CarMesh('player'),
            blue: createF1CarMesh('blue'),
            green: createF1CarMesh('green'),
            yellow: createF1CarMesh('yellow')
          };

          // 9. Pool of 3D Skid Mark Decals on the Tarmac
          st.skidPool = [];
          st.skidCursor = 0;
          const skidGeo = new THREE.PlaneGeometry(18, 3.2);
          skidGeo.rotateX(-Math.PI / 2);
          const skidMat = new THREE.MeshBasicMaterial({
            color: 0x090d16,
            transparent: true,
            opacity: 0.42,
            depthWrite: false
          });
          for (let i = 0; i < 90; i++) {
            const smMesh = new THREE.Mesh(skidGeo, skidMat);
            smMesh.visible = false;
            scene.add(smMesh);
            st.skidPool.push(smMesh);
          }

          // 10. Pool of 3D Volumetric Smoke & Spark Particles
          st.particlePool = [];
          const pGeo = new THREE.DodecahedronGeometry(3.0, 1);
          for (let i = 0; i < 65; i++) {
            const pMat = new THREE.MeshStandardMaterial({
              color: 0xf1f5f9,
              emissive: 0x000000,
              roughness: 0.85,
              transparent: true,
              opacity: 0.7
            });
            const pMesh = new THREE.Mesh(pGeo, pMat);
            pMesh.visible = false;
            scene.add(pMesh);
            st.particlePool.push(pMesh);
          }

          st.scene = scene;
          st.builtTrackLevel = track.level;
          st.camPosSmooth = null;
          st.camLookSmooth = null;
        }

        // Update 5 Red Gantry Start Lights during countdown
        if (st.gantryLights && st.gantryLights.length === 5) {
          const cdStage = countdownStageRef.current;
          const tRem = countdownTimerRef.current;
          st.gantryLights.forEach((bMat, idx) => {
            if (tRem <= -0.6) {
              bMat.color.setHex(0x14532d);
            } else if (cdStage === 0) {
              bMat.color.setHex(0x22c55e); // GREEN GO!
            } else {
              const litCount = cdStage === 3 ? 2 : cdStage === 2 ? 4 : 5;
              bMat.color.setHex(idx < litCount ? 0xff0022 : 0x3b0707);
            }
          });
        }

        // Update 3D F1 Cars (Position, Pitch/Roll suspension physics, Steering, Glowing Brake Discs & Afterburners)
        for (const car of racers) {
          const mesh = st.carMeshes[car.id];
          if (!mesh) continue;
          mesh.position.set(car.x, 0.65, car.y);
          mesh.rotation.y = -car.heading;
          // Realistic chassis roll in corners & pitch under braking/acceleration
          const accelDelta = (car.speed - (car.prevSpeed || 0));
          const pitchAngle = clamp(car.isBraking ? -0.032 : accelDelta * 0.0025, -0.04, 0.03);
          const rollAngle = car.drifting ? 0.055 : 0;
          mesh.rotation.z = pitchAngle;
          mesh.rotation.x = rollAngle;
          mesh.visible = !(car.invulnerableTimer > 0 && Math.floor(Date.now() / 80) % 2 === 0);

          const ud = mesh.userData;
          if (ud.brakeLightMat) {
            ud.brakeLightMat.color.setHex(
              car.isBraking ? 0xff0033 : (Math.floor(Date.now() / 110) % 2 === 0 ? 0xef4444 : 0x450a0a)
            );
          }
          if (ud.brakeDiscMats) {
            const glowHex = car.isBraking && car.speed > 120 ? 0xff4500 : 0x000000;
            for (const dm of ud.brakeDiscMats) {
              dm.emissive.setHex(glowHex);
            }
          }
          if (ud.exhaustFlame && ud.flameMat) {
            const showFlame = (car.speed > 260 && Math.random() < 0.45) || (car.isBraking && car.speed > 180 && Math.random() < 0.55);
            ud.flameMat.opacity = showFlame ? (0.55 + Math.random() * 0.4) : 0.0;
            ud.flameMat.color.setHex(Math.random() > 0.35 ? 0x38bdf8 : 0xf97316);
            const fScale = 0.7 + Math.random() * 0.7;
            ud.exhaustFlame.scale.set(1, fScale, 1);
          }
          if (ud.wheels) {
            const spinAngle = (car.totalDistance || 0) * 0.14;
            ud.wheels.forEach(wObj => {
              wObj.spinGrp.rotation.z = -spinAngle;
              if (wObj.isFront) {
                wObj.steerHub.rotation.y = (car.isPlayer ? -((cam.sway || 0) * 0.024) : 0);
              }
            });
          }
        }

        // Sync 3D Skid Marks onto Tarmac
        const skids = skidMarksRef.current;
        for (let i = 0; i < st.skidPool.length; i++) {
          const smMesh = st.skidPool[i];
          if (i < skids.length) {
            const sm = skids[skids.length - 1 - i];
            const mx = (sm.x1 + sm.x2) * 0.5;
            const mz = (sm.y1 + sm.y2) * 0.5;
            const ang = Math.atan2(sm.y2 - sm.y1, sm.x2 - sm.x1);
            smMesh.visible = true;
            smMesh.position.set(mx, 1.25, mz);
            smMesh.rotation.y = -ang;
          } else {
            smMesh.visible = false;
          }
        }

        // Sync 3D Volumetric Particles (Smoke, Sparks, Exhaust Flames)
        const activeParts = particlesRef.current;
        for (let i = 0; i < st.particlePool.length; i++) {
          const pm = st.particlePool[i];
          if (i < activeParts.length) {
            const p = activeParts[i];
            pm.visible = true;
            pm.position.set(p.x, 3.2 + (1 - p.alpha) * 10, p.y);
            const sc = Math.max(0.35, p.size * (p.type === 'smoke' ? 0.52 : 0.32));
            pm.scale.set(sc, sc * 0.85, sc);
            pm.rotation.x += 0.08;
            pm.rotation.y += 0.11;
            pm.material.color.set(p.color || '#f1f5f9');
            if (p.type === 'spark' || p.type === 'flame') {
              pm.material.emissive.set(p.color || '#facc15');
            } else {
              pm.material.emissive.setHex(0x000000);
            }
            pm.material.opacity = clamp(p.alpha * 0.85, 0.08, 0.88);
          } else {
            pm.visible = false;
          }
        }

        // Update Dynamic Shadow Camera snapped to grid increments so shadow edges never shimmer
        const px = player ? player.x : cam.x;
        const pz = player ? player.y : cam.y;
        if (st.sunLight) {
          const snapX = Math.round(px / 16) * 16;
          const snapZ = Math.round(pz / 16) * 16;
          st.sunLight.position.set(snapX + 320, 480, snapZ - 260);
          st.sunLight.target.position.set(snapX, 0, snapZ);
          st.sunLight.target.updateMatrixWorld();
        }

        // Stable, Locked 3D Camera Modes (zero double-smoothing lag or FOV warp)
        const subMode = camSubModeRef.current || 'CHASE';
        const desiredFov = subMode === 'COCKPIT' ? 68 : 60;
        if (Math.abs(st.camera.fov - desiredFov) > 0.1) {
          st.camera.fov = desiredFov;
          st.camera.updateProjectionMatrix();
        }

        let eyeX, eyeY, eyeZ, lookX, lookY, lookZ;
        if (subMode === 'COCKPIT' && player) {
          const pCos = Math.cos(player.heading);
          const pSin = Math.sin(player.heading);
          eyeX = player.x + pCos * 4.5;
          eyeY = 17.5;
          eyeZ = player.y + pSin * 4.5;
          lookX = player.x + pCos * 220;
          lookY = 11.0;
          lookZ = player.y + pSin * 220;
        } else {
          const isClose = subMode === 'CLOSE';
          const cam3DDist = isClose ? 84 : 114;
          const cam3DHeight = isClose ? 30 : 42;
          eyeX = px - cosA * cam3DDist - sinA * (cam.sway || 0) * 0.35;
          eyeY = cam3DHeight;
          eyeZ = pz - sinA * cam3DDist + cosA * (cam.sway || 0) * 0.35;
          const lookAheadDist = isClose ? 115 : 100;
          lookX = px + cosA * lookAheadDist;
          lookY = isClose ? 9.5 : 11.5;
          lookZ = pz + sinA * lookAheadDist;
        }

        st.camera.position.set(eyeX, eyeY, eyeZ);
        st.camera.lookAt(lookX, lookY, lookZ);

        st.renderer.render(st.scene, st.camera);
        ctx.drawImage(st.renderer.domElement, 0, 0, canvasWidth, canvasHeight);
        return true;
      } catch (err) {
        return false;
      }
    };

    ctx.save();
    let handledView = false;
    if (viewModeRef.current === '2D') {
      render2DTopDown();
      handledView = true;
    } else if (viewModeRef.current === '3D') {
      handledView = renderReal3DWebGL();
    }
    if (!handledView) {

    // --- 1. SKY & FLUFFY CLOUDS & DISTANT MOUNTAINS / HILLS HORIZON (matching 30498.jpg) ---
    const isDarkBiome = ['#090d16', '#020617', '#18181b', '#111827', '#1e1b4b', '#270909', '#2e1065'].includes(biome.tileDark);
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
    if (isDarkBiome) {
      skyGrad.addColorStop(0, '#090d16');
      skyGrad.addColorStop(0.55, '#1e293b');
      skyGrad.addColorStop(1, '#38bdf8');
    } else {
      skyGrad.addColorStop(0, '#1d74d8');
      skyGrad.addColorStop(0.58, '#4ba3f5');
      skyGrad.addColorStop(1, '#bae6fd');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvasWidth, horizonY + 2);

    // Parallax scrolling based on camera heading
    const normHeading = ((camAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const skyPeriod = 1600;
    const skyScroll = (normHeading / (Math.PI * 2)) * skyPeriod;

    // Fluffy pixel-art clouds along the horizon
    const drawCloudCluster = (baseX, baseY, scaleC) => {
      const puffs = [
        { dx: -56, dy: 8, r: 24 },
        { dx: -28, dy: -6, r: 34 },
        { dx: 8, dy: -14, r: 40 },
        { dx: 44, dy: -4, r: 30 },
        { dx: 72, dy: 10, r: 22 }
      ];
      // Cloud shadow base
      ctx.fillStyle = isDarkBiome ? '#64748b' : '#cbd5e1';
      ctx.beginPath();
      for (const pf of puffs) {
        ctx.arc(baseX + pf.dx * scaleC, baseY + (pf.dy + 7) * scaleC, pf.r * scaleC, 0, Math.PI * 2);
      }
      ctx.fill();
      // Main bright cloud body
      ctx.fillStyle = isDarkBiome ? '#e2e8f0' : '#ffffff';
      ctx.beginPath();
      for (const pf of puffs) {
        ctx.arc(baseX + pf.dx * scaleC, baseY + pf.dy * scaleC, pf.r * scaleC, 0, Math.PI * 2);
      }
      ctx.fill();
      // Crisp top highlight
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      for (const pf of puffs) {
        ctx.arc(baseX + (pf.dx - 3) * scaleC, baseY + (pf.dy - 4) * scaleC, pf.r * 0.72 * scaleC, 0, Math.PI * 2);
      }
      ctx.fill();
    };

    const cloudDefs = [
      { x: 110, y: horizonY - 76, s: 1.15 },
      { x: 370, y: horizonY - 94, s: 1.35 },
      { x: 660, y: horizonY - 72, s: 1.05 },
      { x: 940, y: horizonY - 88, s: 1.28 },
      { x: 1240, y: horizonY - 78, s: 1.12 },
      { x: 1490, y: horizonY - 92, s: 1.22 }
    ];
    for (let rep = -1; rep <= 1; rep++) {
      for (const cd of cloudDefs) {
        const cx = cd.x - (skyScroll * 0.65 % skyPeriod) + rep * skyPeriod;
        if (cx > -220 && cx < canvasWidth + 220) {
          drawCloudCluster(cx, cd.y, cd.s);
        }
      }
    }

    // Distant mountain range silhouette
    ctx.fillStyle = isDarkBiome ? '#1e293b' : '#5b82a6';
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    const mtnPeaks = [0, 95, 190, 310, 420, 540, 670, 790, 920, 1050, 1180, 1310, 1450, 1600];
    const mtnHeights = [46, 82, 54, 96, 48, 78, 62, 92, 44, 84, 58, 74, 50, 46];
    for (let rep = -1; rep <= 1; rep++) {
      for (let i = 0; i < mtnPeaks.length; i++) {
        const mx = mtnPeaks[i] - (skyScroll * 0.85 % skyPeriod) + rep * skyPeriod;
        const my = horizonY - mtnHeights[i];
        ctx.lineTo(mx, my);
      }
    }
    ctx.lineTo(canvasWidth, horizonY);
    ctx.closePath();
    ctx.fill();

    // Mountain sunlit ridges
    ctx.fillStyle = isDarkBiome ? '#334155' : '#7ba0c2';
    for (let rep = -1; rep <= 1; rep++) {
      for (let i = 0; i < mtnPeaks.length - 1; i += 2) {
        const mx1 = mtnPeaks[i] - (skyScroll * 0.85 % skyPeriod) + rep * skyPeriod;
        const my1 = horizonY - mtnHeights[i];
        const mx2 = mtnPeaks[i + 1] - (skyScroll * 0.85 % skyPeriod) + rep * skyPeriod;
        const my2 = horizonY - mtnHeights[i + 1];
        if (mx2 > 0 && mx1 < canvasWidth) {
          ctx.beginPath();
          ctx.moveTo(mx1, horizonY);
          ctx.lineTo(mx2, my2);
          ctx.lineTo(mx2, horizonY);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    // Green/biome rolling foothills & distant treeline at horizon
    ctx.fillStyle = isDarkBiome ? biome.tileLight : '#2e7d32';
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    for (let sx = 0; sx <= canvasWidth + 40; sx += 32) {
      const worldX = sx + skyScroll;
      const hillH = 14 + Math.sin(worldX * 0.008) * 9 + Math.cos(worldX * 0.019) * 5;
      ctx.lineTo(sx, horizonY - Math.max(4, hillH));
    }
    ctx.lineTo(canvasWidth, horizonY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = isDarkBiome ? biome.tileSpecLight : '#4caf50';
    ctx.fillRect(0, horizonY - 4, canvasWidth, 4);

    // --- 2. PERSPECTIVE GROUND PLANE (classic 16-bit OutRun / Super Monaco GP horizontal distance bands) ---
    const groundH = canvasHeight - horizonY;
    ctx.fillStyle = biome.tileDark;
    ctx.fillRect(0, horizonY, canvasWidth, groundH);

    const zBandSize = 70;
    const camForwardScroll = player ? (player.totalDistance || 0) : 0;
    let prevScreenY = horizonY;
    for (let py = 2; py <= groundH; py += 3) {
      const sy = horizonY + py;
      const worldZ = (camHeight * focalLength) / Math.max(1, py);
      const bandIdx = Math.floor((worldZ + camForwardScroll) / zBandSize);
      const isLightBand = (bandIdx & 1) === 0;
      ctx.fillStyle = isLightBand ? biome.tileLight : biome.tileDark;
      ctx.fillRect(0, prevScreenY, canvasWidth, sy - prevScreenY + 1);
      prevScreenY = sy;
    }

    // --- 3. 3D CAMERA PROJECTION HELPERS ---
    const toCamSpace = (wx, wy) => {
      const dx = wx - camX;
      const dy = wy - camY;
      return {
        forward: dx * cosA + dy * sinA,
        right: -dx * sinA + dy * cosA
      };
    };

    const projectCamPt = (forward, right, wz = 0) => {
      const scale = focalLength / forward;
      return {
        x: centerX + right * scale,
        y: horizonY + (camHeight - wz) * scale,
        scale
      };
    };

    const fillProjectedQuad = (w1x, w1y, w2x, w2y, w3x, w3y, w4x, w4y, color) => {
      const c1 = toCamSpace(w1x, w1y);
      const c2 = toCamSpace(w2x, w2y);
      const c3 = toCamSpace(w3x, w3y);
      const c4 = toCamSpace(w4x, w4y);
      if (c1.forward < nearClip && c2.forward < nearClip && c3.forward < nearClip && c4.forward < nearClip) return;
      if (c1.forward > farClip && c2.forward > farClip && c3.forward > farClip && c4.forward > farClip) return;

      const pts = [c1, c2, c3, c4];
      const clipped = [];
      for (let i = 0; i < 4; i++) {
        const curr = pts[i];
        const next = pts[(i + 1) % 4];
        const currIn = curr.forward >= nearClip;
        const nextIn = next.forward >= nearClip;
        if (currIn) clipped.push(curr);
        if (currIn !== nextIn) {
          const t = (nearClip - curr.forward) / (next.forward - curr.forward);
          clipped.push({
            forward: nearClip,
            right: curr.right + (next.right - curr.right) * t
          });
        }
      }
      if (clipped.length < 3) return;
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < clipped.length; i++) {
        const sp = projectCamPt(clipped[i].forward, clipped[i].right, 0);
        if (i === 0) ctx.moveTo(sp.x, sp.y);
        else ctx.lineTo(sp.x, sp.y);
      }
      ctx.closePath();
      ctx.fill();
    };

    // --- 4. COLLECT & SORT 3D TRACK SEGMENTS (Painter's Algorithm Back-to-Front) ---

    const visibleSegments = [];
    for (let i = 0; i < totalSamples; i++) {
      const p1 = samples[i];
      const p2 = samples[(i + 1) % totalSamples];
      const c1 = toCamSpace(p1.x, p1.y);
      const c2 = toCamSpace(p2.x, p2.y);
      const maxF = Math.max(c1.forward, c2.forward);
      const minF = Math.min(c1.forward, c2.forward);
      if (maxF < nearClip || minF > farClip) continue;
      const avgR = (c1.right + c2.right) * 0.5;
      const avgF = (c1.forward + c2.forward) * 0.5;
      if (avgF > 120 && Math.abs(avgR) > avgF * 2.6 + 380) continue;
      visibleSegments.push({
        idx: i,
        p1,
        p2,
        depth: avgF
      });
    }

    visibleSegments.sort((a, b) => b.depth - a.depth);

    for (const seg of visibleSegments) {
      const { idx, p1, p2 } = seg;
      // Gravel runoff on corners
      if (p1.curvature > 0.032 || p2.curvature > 0.032) {
        fillProjectedQuad(
          p1.x + p1.nx * (halfRoad + curbW), p1.y + p1.ny * (halfRoad + curbW),
          p1.x + p1.nx * (halfRoad + curbW + gravelWidth), p1.y + p1.ny * (halfRoad + curbW + gravelWidth),
          p2.x + p2.nx * (halfRoad + curbW + gravelWidth), p2.y + p2.ny * (halfRoad + curbW + gravelWidth),
          p2.x + p2.nx * (halfRoad + curbW), p2.y + p2.ny * (halfRoad + curbW),
          biome.gravel
        );
        fillProjectedQuad(
          p1.x - p1.nx * (halfRoad + curbW + gravelWidth), p1.y - p1.ny * (halfRoad + curbW + gravelWidth),
          p1.x - p1.nx * (halfRoad + curbW), p1.y - p1.ny * (halfRoad + curbW),
          p2.x - p2.nx * (halfRoad + curbW), p2.y - p2.ny * (halfRoad + curbW),
          p2.x - p2.nx * (halfRoad + curbW + gravelWidth), p2.y - p2.ny * (halfRoad + curbW + gravelWidth),
          biome.gravel
        );
      }

      // Alternating red/white 3D curbs (rumble strips)
      const isCurbA = Math.floor(idx / 4) % 2 === 0;
      const curbColor = isCurbA ? biome.curbA : biome.curbB;
      fillProjectedQuad(
        p1.x + p1.nx * halfRoad, p1.y + p1.ny * halfRoad,
        p1.x + p1.nx * (halfRoad + curbW), p1.y + p1.ny * (halfRoad + curbW),
        p2.x + p2.nx * (halfRoad + curbW), p2.y + p2.ny * (halfRoad + curbW),
        p2.x + p2.nx * halfRoad, p2.y + p2.ny * halfRoad,
        curbColor
      );
      fillProjectedQuad(
        p1.x - p1.nx * (halfRoad + curbW), p1.y - p1.ny * (halfRoad + curbW),
        p1.x - p1.nx * halfRoad, p1.y - p1.ny * halfRoad,
        p2.x - p2.nx * halfRoad, p2.y - p2.ny * halfRoad,
        p2.x - p2.nx * (halfRoad + curbW), p2.y - p2.ny * (halfRoad + curbW),
        curbColor
      );

      // Main asphalt tarmac surface (slightly alternating shade for high-speed motion sensation)
      const tarmacShade = biome.tarmac;
      fillProjectedQuad(
        p1.x - p1.nx * halfRoad, p1.y - p1.ny * halfRoad,
        p1.x + p1.nx * halfRoad, p1.y + p1.ny * halfRoad,
        p2.x + p2.nx * halfRoad, p2.y + p2.ny * halfRoad,
        p2.x - p2.nx * halfRoad, p2.y - p2.ny * halfRoad,
        tarmacShade
      );

      // Subtle dark racing grooves
      const grooveOff = halfRoad * 0.44;
      const grooveHalf = 8;
      fillProjectedQuad(
        p1.x + p1.nx * (grooveOff - grooveHalf), p1.y + p1.ny * (grooveOff - grooveHalf),
        p1.x + p1.nx * (grooveOff + grooveHalf), p1.y + p1.ny * (grooveOff + grooveHalf),
        p2.x + p2.nx * (grooveOff + grooveHalf), p2.y + p2.ny * (grooveOff + grooveHalf),
        p2.x + p2.nx * (grooveOff - grooveHalf), p2.y + p2.ny * (grooveOff - grooveHalf),
        biome.racingLine
      );
      fillProjectedQuad(
        p1.x - p1.nx * (grooveOff + grooveHalf), p1.y - p1.ny * (grooveOff + grooveHalf),
        p1.x - p1.nx * (grooveOff - grooveHalf), p1.y - p1.ny * (grooveOff - grooveHalf),
        p2.x - p2.nx * (grooveOff - grooveHalf), p2.y - p2.ny * (grooveOff - grooveHalf),
        p2.x - p2.nx * (grooveOff + grooveHalf), p2.y - p2.ny * (grooveOff + grooveHalf),
        biome.racingLine
      );

      // Crisp white track edge lines
      const edgeW = 3.5;
      fillProjectedQuad(
        p1.x + p1.nx * (halfRoad - edgeW), p1.y + p1.ny * (halfRoad - edgeW),
        p1.x + p1.nx * halfRoad, p1.y + p1.ny * halfRoad,
        p2.x + p2.nx * halfRoad, p2.y + p2.ny * halfRoad,
        p2.x + p2.nx * (halfRoad - edgeW), p2.y + p2.ny * (halfRoad - edgeW),
        '#ffffff'
      );
      fillProjectedQuad(
        p1.x - p1.nx * halfRoad, p1.y - p1.ny * halfRoad,
        p1.x - p1.nx * (halfRoad - edgeW), p1.y - p1.ny * (halfRoad - edgeW),
        p2.x - p2.nx * (halfRoad - edgeW), p2.y - p2.ny * (halfRoad - edgeW),
        p2.x - p2.nx * halfRoad, p2.y - p2.ny * halfRoad,
        '#ffffff'
      );

      // Center dashed lane divider
      if (Math.floor(idx / 3) % 2 === 0) {
        const dashHalf = 2.5;
        fillProjectedQuad(
          p1.x - p1.nx * dashHalf, p1.y - p1.ny * dashHalf,
          p1.x + p1.nx * dashHalf, p1.y + p1.ny * dashHalf,
          p2.x + p2.nx * dashHalf, p2.y + p2.ny * dashHalf,
          p2.x - p2.nx * dashHalf, p2.y - p2.ny * dashHalf,
          'rgba(241, 245, 249, 0.55)'
        );
      }

      // Checkered Start / Finish Line at idx 0..1
      if (idx === 0 || idx === 1) {
        const checkSlices = 10;
        for (let c = 0; c < checkSlices; c++) {
          const tA = -halfRoad + (c / checkSlices) * track.trackWidth;
          const tB = -halfRoad + ((c + 1) / checkSlices) * track.trackWidth;
          const isBlack = (idx + c) % 2 === 0;
          fillProjectedQuad(
            p1.x + p1.nx * tA, p1.y + p1.ny * tA,
            p1.x + p1.nx * tB, p1.y + p1.ny * tB,
            p2.x + p2.nx * tB, p2.y + p2.ny * tB,
            p2.x + p2.nx * tA, p2.y + p2.ny * tA,
            isBlack ? '#090d16' : '#ffffff'
          );
        }
      }
    }

    // --- 5. SKID MARKS IN 3D PERSPECTIVE ---
    for (const sm of skidMarksRef.current) {
      const c1 = toCamSpace(sm.x1, sm.y1);
      const c2 = toCamSpace(sm.x2, sm.y2);
      if (c1.forward < nearClip || c2.forward < nearClip || c1.forward > 1400) continue;
      const s1 = projectCamPt(c1.forward, c1.right, 0);
      const s2 = projectCamPt(c2.forward, c2.right, 0);
      ctx.strokeStyle = `rgba(15, 23, 42, ${sm.alpha})`;
      ctx.lineWidth = Math.max(1.5, Math.min(8, s1.scale * 4.5));
      ctx.beginPath();
      ctx.moveTo(s1.x, s1.y);
      ctx.lineTo(s2.x, s2.y);
      ctx.stroke();
    }

    // --- 6. COLLECT & DEPTH-SORT 3D PROPS, PARTICLES & F1 CARS ---
    const renderQueue = [];

    if (track.decorations) {
      for (const dec of track.decorations) {
        const c = toCamSpace(dec.x, dec.y);
        if (c.forward < nearClip || c.forward > farClip * 0.85) continue;
        if (Math.abs(c.right) > c.forward * 2.2 + 260) continue;
        renderQueue.push({ kind: 'dec', depth: c.forward, right: c.right, dec });
      }
    }

    for (const p of particlesRef.current) {
      const c = toCamSpace(p.x, p.y);
      if (c.forward < nearClip || c.forward > 1800) continue;
      renderQueue.push({ kind: 'particle', depth: c.forward, right: c.right, p });
    }

    for (const car of racers) {
      const c = toCamSpace(car.x, car.y);
      if (c.forward < nearClip * 0.7 || c.forward > farClip) continue;
      renderQueue.push({ kind: 'car', depth: Math.max(nearClip, c.forward), right: c.right, car });
    }

    renderQueue.sort((a, b) => b.depth - a.depth);

    // Helper to draw a 3D F1 car in the behind-the-car chase perspective (matching 30498.jpg)
    const drawCar3DChase = (car, sx, sy, scale, relAngle) => {
      const livery = LIVERIES[car.id] || LIVERIES.player;
      const yaw = clamp(Math.sin(relAngle) * 1.15, -1, 1);
      const shift = yaw * 26;
      const carScale = Math.max(0.08, Math.min(2.6, scale * 1.55));

      ctx.save();
      ctx.translate(sx, sy);
      if (car.invulnerableTimer > 0 && Math.floor(Date.now() / 80) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }
      ctx.scale(carScale, carScale);

      // Ground contact shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.beginPath();
      ctx.ellipse(shift * 0.25, 2, 46, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      // Front wheels (further forward in perspective, slightly narrower & higher on screen)
      const drawTire3D = (tx, ty, tw, th, isRear) => {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(tx - tw * 0.5, ty - th, tw, th);
        // Tire tread & shoulder highlight
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(tx - tw * 0.5 + 1.5, ty - th + 1.5, tw - 3, th - 3);
        ctx.fillStyle = '#334155';
        ctx.fillRect(tx - tw * 0.36, ty - th + 2, tw * 0.72, 3);
        // Sidewall compound stripe
        ctx.fillStyle = livery.tireCompound;
        ctx.fillRect(tx - tw * 0.5 + 1, ty - th + 3, 2, th - 6);
        ctx.fillRect(tx + tw * 0.5 - 3, ty - th + 3, 2, th - 6);
        if (isRear) {
          // Outer wheel rim glow when angled
          ctx.fillStyle = '#64748b';
          ctx.fillRect(tx - 2, ty - th * 0.6, 4, 4);
        }
      };

      const frontWheelOffset = 31;
      const frontY = -12;
      drawTire3D(shift * 0.85 - frontWheelOffset, frontY, 13, 18, false);
      drawTire3D(shift * 0.85 + frontWheelOffset, frontY, 13, 18, false);

      // Front wing tips visible when car turns or at an angle
      ctx.fillStyle = livery.accent;
      ctx.fillRect(shift * 0.95 - 36, frontY - 4, 72, 3);
      ctx.fillStyle = livery.primaryDark;
      ctx.fillRect(shift * 0.95 - 34, frontY - 7, 68, 3);

      // Front suspension wishbones
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(shift * 0.55 - 10, -19);
      ctx.lineTo(shift * 0.85 - frontWheelOffset + 4, frontY - 9);
      ctx.moveTo(shift * 0.55 + 10, -19);
      ctx.lineTo(shift * 0.85 + frontWheelOffset - 4, frontY - 9);
      ctx.stroke();

      // Sidepods & floor aero blades
      ctx.fillStyle = '#090d16';
      ctx.fillRect(shift * 0.35 - 30, -8, 60, 5);
      ctx.fillStyle = livery.primaryDark;
      ctx.beginPath();
      ctx.moveTo(shift * 0.25 - 26, -6);
      ctx.lineTo(shift * 0.6 - 24, -22);
      ctx.lineTo(shift * 0.6 + 24, -22);
      ctx.lineTo(shift * 0.25 + 26, -6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = livery.primary;
      ctx.fillRect(shift * 0.4 - 24, -20, 48, 12);
      // Sidepod radiator intakes
      ctx.fillStyle = '#020617';
      ctx.fillRect(shift * 0.45 - 21, -18, 9, 6);
      ctx.fillRect(shift * 0.45 + 12, -18, 9, 6);
      // Sidepod accent stripe
      ctx.fillStyle = livery.accent;
      ctx.fillRect(shift * 0.4 - 23, -11, 46, 2.5);

      // Engine cover & central airbox / roll hoop
      ctx.fillStyle = livery.primary;
      ctx.beginPath();
      ctx.moveTo(shift * 0.2 - 11, -14);
      ctx.lineTo(shift * 0.55 - 5, -35);
      ctx.lineTo(shift * 0.55 + 5, -35);
      ctx.lineTo(shift * 0.2 + 11, -14);
      ctx.closePath();
      ctx.fill();

      // Shark fin & livery dorsal stripe
      ctx.fillStyle = livery.accent;
      ctx.beginPath();
      ctx.moveTo(shift * 0.15, -16);
      ctx.lineTo(shift * 0.52, -35);
      ctx.lineTo(shift * 0.52 + 2.5, -35);
      ctx.lineTo(shift * 0.15 + 2.5, -16);
      ctx.closePath();
      ctx.fill();

      // Cockpit halo & driver helmet
      ctx.fillStyle = '#020617';
      ctx.fillRect(shift * 0.58 - 7, -30, 14, 6);
      ctx.fillStyle = livery.helmet;
      ctx.beginPath();
      ctx.arc(shift * 0.6, -28, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = livery.visor;
      ctx.fillRect(shift * 0.6 - 4, -30, 8, 2.5);
      ctx.fillStyle = livery.halo;
      ctx.strokeStyle = livery.halo;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(shift * 0.58, -27, 7.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();

      // Rear suspension arms
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-12, -10);
      ctx.lineTo(-34 + shift * 0.15, -12);
      ctx.moveTo(12, -10);
      ctx.lineTo(34 + shift * 0.15, -12);
      ctx.stroke();

      // Wide rear F1 slick tires (closest to camera, prominent like 30498.jpg)
      const rearWheelOffset = 34;
      drawTire3D(-rearWheelOffset + shift * 0.15, 0, 18, 25, true);
      drawTire3D(rearWheelOffset + shift * 0.15, 0, 18, 25, true);

      // Rear diffuser & gearbox housing + FIA rain/brake light
      ctx.fillStyle = '#090d16';
      ctx.fillRect(shift * 0.1 - 15, -11, 30, 9);
      ctx.fillStyle = '#334155';
      ctx.fillRect(shift * 0.1 - 13, -9, 2, 7);
      ctx.fillRect(shift * 0.1 - 6, -9, 2, 7);
      ctx.fillRect(shift * 0.1 + 4, -9, 2, 7);
      ctx.fillRect(shift * 0.1 + 11, -9, 2, 7);

      // Exhaust pipe & central rain light
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.arc(shift * 0.12, -14, 2.6, 0, Math.PI * 2);
      ctx.fill();
      const rainBlink = car.isBraking || Math.floor(Date.now() / 120) % 2 === 0;
      ctx.fillStyle = car.isBraking ? '#ff0033' : (rainBlink ? '#ef4444' : '#7f1d1d');
      ctx.fillRect(shift * 0.1 - 2.2, -9.5, 4.4, 5.5);
      if (car.isBraking) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(shift * 0.1 - 1, -8, 2, 2.5);
      }

      // Iconic high F1 Rear Wing + Endplates
      const wingX = shift * 0.12;
      const wingW = 46;
      // Endplates
      ctx.fillStyle = livery.primaryDark;
      ctx.fillRect(wingX - wingW * 0.5 - 3, -31, 4, 18);
      ctx.fillRect(wingX + wingW * 0.5 - 1, -31, 4, 18);
      ctx.fillStyle = livery.accent;
      ctx.fillRect(wingX - wingW * 0.5 - 3, -31, 4, 4);
      ctx.fillRect(wingX + wingW * 0.5 - 1, -31, 4, 4);
      // Main rear wing planes
      ctx.fillStyle = '#090d16';
      ctx.fillRect(wingX - wingW * 0.5, -29, wingW, 10);
      ctx.fillStyle = livery.primary;
      ctx.fillRect(wingX - wingW * 0.5 + 1, -28, wingW - 2, 5);
      ctx.fillStyle = livery.primaryLight;
      ctx.fillRect(wingX - wingW * 0.5 + 1, -29, wingW - 2, 2);
      ctx.fillStyle = livery.accent;
      ctx.fillRect(wingX - wingW * 0.5 + 2, -22, wingW - 4, 2.5);

      // Tire smoke puffs behind rear tires when accelerating hard, braking, or drifting (just like 30498.jpg)
      const showSmokePuffs = car.drifting || car.isBraking || (car.speed > 45 && car.speed < 290) || Math.abs(yaw) > 0.28;
      if (showSmokePuffs) {
        const tNow = Date.now() * 0.014;
        for (const side of [-1, 1]) {
          const baseWX = side * rearWheelOffset + shift * 0.15;
          for (let k = 0; k < 3; k++) {
            const phase = (tNow + k * 0.9 + (side > 0 ? 0.4 : 0)) % 2.4;
            const px = baseWX + side * (k * 4 + phase * 3) + Math.sin(tNow + k) * 2;
            const py = 2 + phase * 4.5 - k * 1.5;
            const pr = (4.5 + phase * 3.2) * (car.drifting ? 1.25 : 0.9);
            ctx.fillStyle = `rgba(241, 245, 249, ${Math.max(0.15, 0.78 - phase * 0.28)})`;
            ctx.beginPath();
            ctx.arc(px, py, pr, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      ctx.restore();
    };

    for (const item of renderQueue) {
      if (item.kind === 'dec') {
        const { dec, depth, right } = item;
        const sp = projectCamPt(depth, right, 0);
        const s = sp.scale * 1.35;
        if (s < 0.06) continue;
        ctx.save();
        ctx.translate(sp.x, sp.y);
        ctx.scale(s, s);
        if (dec.type === 'tire_barrier') {
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.fillRect(-22, -2, 44, 6);
          [-15, -5, 5, 15].forEach((tx, idx) => {
            const isRed = (idx + (dec.variant || 0)) % 2 === 0;
            ctx.fillStyle = isRed ? '#dc2626' : '#f8fafc';
            ctx.fillRect(tx - 4, -18, 9, 18);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(tx - 4, -12, 9, 3);
          });
        } else if (dec.type === 'chevron') {
          ctx.fillStyle = '#475569';
          ctx.fillRect(-14, -16, 4, 16);
          ctx.fillRect(10, -16, 4, 16);
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(-22, -34, 44, 20);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-16, -30, 8, 12);
          ctx.fillRect(-2, -30, 8, 12);
          ctx.fillRect(12, -30, 6, 12);
        } else if (dec.type === 'banner') {
          ctx.fillStyle = '#334155';
          ctx.fillRect(-46, -54, 6, 54);
          ctx.fillRect(40, -54, 6, 54);
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(-50, -68, 100, 22);
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 2;
          ctx.strokeRect(-50, -68, 100, 22);
          ctx.fillStyle = '#ffffff';
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(dec.text ?? 'APEX GP', 0, -57);
        } else if (dec.type === 'palm') {
          ctx.fillStyle = '#78350f';
          ctx.fillRect(-4, -52, 8, 52);
          ctx.fillStyle = '#10b981';
          ctx.beginPath();
          ctx.arc(0, -56, 22, Math.PI, 0);
          ctx.fill();
          ctx.fillStyle = '#34d399';
          ctx.fillRect(-24, -56, 48, 8);
        } else if (dec.type === 'cactus') {
          ctx.fillStyle = '#15803d';
          ctx.fillRect(-6, -46, 12, 46);
          ctx.fillRect(-18, -32, 12, 7);
          ctx.fillRect(-18, -42, 7, 14);
          ctx.fillRect(6, -28, 12, 7);
          ctx.fillRect(11, -38, 7, 14);
        } else if (dec.type === 'snow_pine') {
          ctx.fillStyle = '#451a03';
          ctx.fillRect(-5, -16, 10, 16);
          ctx.fillStyle = '#0f766e';
          ctx.beginPath();
          ctx.moveTo(0, -64);
          ctx.lineTo(24, -14);
          ctx.lineTo(-24, -14);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(0, -64);
          ctx.lineTo(12, -38);
          ctx.lineTo(-12, -38);
          ctx.closePath();
          ctx.fill();
        } else if (dec.type === 'neon_pylon') {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-10, -56, 20, 56);
          ctx.fillStyle = (dec.variant ?? 0) % 2 === 0 ? '#22d3ee' : '#ec4899';
          ctx.fillRect(-6, -50, 12, 42);
        } else {
          // Classic lush pixel tree
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.beginPath();
          ctx.ellipse(0, 0, 20, 6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#451a03';
          ctx.fillRect(-5, -22, 10, 22);
          const crownColor = dec.type === 'autumn_tree' ? '#ea580c' : dec.type === 'sakura_tree' ? '#ec4899' : '#15803d';
          const highlightColor = dec.type === 'autumn_tree' ? '#fbbf24' : dec.type === 'sakura_tree' ? '#fbcfe8' : '#22c55e';
          ctx.fillStyle = crownColor;
          ctx.beginPath();
          ctx.arc(0, -38, 22, 0, Math.PI * 2);
          ctx.arc(-14, -28, 16, 0, Math.PI * 2);
          ctx.arc(14, -28, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = highlightColor;
          ctx.beginPath();
          ctx.arc(-5, -44, 13, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      } else if (item.kind === 'particle') {
        const { p, depth, right } = item;
        const sp = projectCamPt(depth, right, 4);
        const sz = Math.max(2, p.size * sp.scale * 1.9);
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        if (p.type === 'smoke') {
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sz, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(sp.x - sz * 0.5, sp.y - sz * 0.5, sz, sz);
        }
        ctx.restore();
      } else if (item.kind === 'car') {
        const { car, depth, right } = item;
        const sp = projectCamPt(depth, right, 0);
        const relAngle = normalizeAngle(car.heading - camAngle);
        drawCar3DChase(car, sp.x, sp.y, sp.scale, relAngle);
      }
    }
    } // end if (!handledView)
